<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeX – User Dashboard</title>
    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #0b0e14;
            color: #e8edf5;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        .hidden {
            display: none !important;
        }

        /* ---------- BUTTONS ---------- */
        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0b0e14;
            padding: 14px 36px;
            border-radius: 40px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
            box-shadow: 0 8px 30px rgba(251, 191, 36, 0.25);
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 16px 40px rgba(251, 191, 36, 0.4);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-primary.small {
            padding: 10px 24px;
            font-size: 14px;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #4b5563;
            color: #e5e7eb;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        .btn-outline:hover:not(:disabled) {
            border-color: #fbbf24;
            color: #fbbf24;
        }
        .btn-outline:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-danger {
            background: #dc2626;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        .btn-danger:hover:not(:disabled) {
            background: #b91c1c;
        }
        .btn-success {
            background: #16a34a;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        .btn-success:hover:not(:disabled) {
            background: #15803d;
        }
        .btn-ghost {
            background: transparent;
            color: #fbbf24;
            border: 1px solid #fbbf24;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 13px;
        }
        .btn-ghost:hover {
            background: rgba(251, 191, 36, 0.1);
        }

        /* ---------- HEADER ---------- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid rgba(31, 41, 55, 0.6);
            flex-wrap: wrap;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(11, 14, 20, 0.95);
            backdrop-filter: blur(4px);
        }
        .logo {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s ease;
        }
        .logo:hover {
            transform: scale(1.05);
        }
        .logo span {
            color: #6b7280;
            font-weight: 400;
            background: none;
            -webkit-text-fill-color: #6b7280;
        }
        .logo-icon {
            font-size: 28px;
            -webkit-text-fill-color: initial;
            color: #fbbf24;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #9ca3af;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.2s ease;
            cursor: pointer;
            padding: 6px 0;
            border-bottom: 2px solid transparent;
        }
        .nav-links a:hover {
            color: #fbbf24;
            border-bottom-color: #fbbf24;
        }
        .user-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1f2937;
            padding: 6px 16px 6px 12px;
            border-radius: 30px;
            border: 1px solid #374151;
        }
        .user-badge .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0b0e14;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
        }
        .user-badge .uname {
            font-size: 14px;
            color: #e5e7eb;
            font-weight: 500;
        }
        .user-badge .role-tag {
            font-size: 10px;
            text-transform: uppercase;
            background: #374151;
            padding: 2px 10px;
            border-radius: 20px;
            color: #9ca3af;
            letter-spacing: 0.5px;
        }

        /* ---------- DASHBOARD LAYOUT ---------- */
        .dash-wrapper {
            display: flex;
            gap: 30px;
            padding: 30px 0;
            min-height: 70vh;
        }
        .dash-sidebar {
            width: 240px;
            flex-shrink: 0;
            background: #141a24;
            border-radius: 20px;
            border: 1px solid #1f2937;
            padding: 20px 0;
            height: fit-content;
            position: sticky;
            top: 80px;
        }
        .dash-sidebar .menu-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 24px;
            color: #9ca3af;
            font-weight: 500;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }
        .dash-sidebar .menu-item:hover {
            color: #e5e7eb;
            background: #1a212d;
        }
        .dash-sidebar .menu-item.active {
            color: #fbbf24;
            border-left-color: #fbbf24;
            background: rgba(251, 191, 36, 0.08);
        }
        .dash-sidebar .menu-item .icon {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }
        .dash-content {
            flex: 1;
            min-width: 0;
        }

        /* ---------- DASHBOARD CARDS ---------- */
        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
        }
        .dash-header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .dash-header .sub {
            color: #9ca3af;
            font-size: 15px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #141a24;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 20px 24px;
            transition: all 0.3s ease;
            border-top: 2px solid transparent;
        }
        .stat-card:hover {
            border-color: #fbbf24;
            transform: translateY(-2px);
            box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.5);
        }
        .stat-card .num {
            font-size: 32px;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
        }
        .stat-card .label {
            font-size: 14px;
            color: #9ca3af;
            margin-top: 2px;
        }
        .stat-card.gold-border {
            border-top-color: #fbbf24;
        }
        .stat-card.blue-border {
            border-top-color: #3b82f6;
        }
        .stat-card.green-border {
            border-top-color: #34d399;
        }
        .stat-card.red-border {
            border-top-color: #f87171;
        }
        .stat-card.purple-border {
            border-top-color: #a78bfa;
        }

        /* ---------- TABLES ---------- */
        .table-wrap {
            background: #141a24;
            border: 1px solid #1f2937;
            border-radius: 16px;
            overflow: hidden;
            margin-top: 16px;
        }
        .table-wrap table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .table-wrap th {
            text-align: left;
            padding: 14px 20px;
            background: #0f151f;
            color: #9ca3af;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #1f2937;
        }
        .table-wrap td {
            padding: 14px 20px;
            border-bottom: 1px solid #1f2937;
            color: #e5e7eb;
        }
        .table-wrap tr:last-child td {
            border-bottom: none;
        }
        .table-wrap tr:hover td {
            background: #1a212d;
        }
        .badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge.green {
            background: #065f46;
            color: #34d399;
        }
        .badge.yellow {
            background: #78350f;
            color: #fbbf24;
        }
        .badge.blue {
            background: #1e3a5f;
            color: #60a5fa;
        }
        .badge.red {
            background: #7f1d1d;
            color: #f87171;
        }
        .badge.purple {
            background: #4c1d95;
            color: #a78bfa;
        }
        .badge.gray {
            background: #374151;
            color: #9ca3af;
        }

        /* ---------- FORMS ---------- */
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #d1d5db;
            margin-bottom: 4px;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid #2d3748;
            background: #0b0e14;
            color: #e5e7eb;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #fbbf24;
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.1);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* ---------- PRODUCT GRID ---------- */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 16px;
        }
        .product-card {
            background: #141a24;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            transition: all 0.3s ease;
        }
        .product-card:hover {
            border-color: #fbbf24;
            transform: translateY(-4px);
        }
        .product-card .pname {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .product-card .pprice {
            font-size: 24px;
            font-weight: 800;
            color: #fbbf24;
            margin: 8px 0;
        }
        .product-card .pdesc {
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 16px;
        }
        .product-card .owned-badge {
            display: inline-block;
            background: #065f46;
            color: #34d399;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        /* ---------- CHAT ---------- */
        .chat-container {
            display: flex;
            flex-direction: column;
            background: #141a24;
            border: 1px solid #1f2937;
            border-radius: 16px;
            overflow: hidden;
            height: 450px;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
        }
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: #0b0e14;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 3px;
        }
        .chat-message {
            max-width: 75%;
            padding: 10px 16px;
            border-radius: 12px;
            word-break: break-word;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .chat-message.user {
            align-self: flex-end;
            background: #fbbf24;
            color: #0b0e14;
            border-bottom-right-radius: 4px;
        }
        .chat-message.admin {
            align-self: flex-start;
            background: #1f2937;
            color: #e5e7eb;
            border-bottom-left-radius: 4px;
        }
        .chat-message .meta {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }
        .chat-message.user .meta {
            color: #78350f;
        }
        .chat-message .attachments {
            margin-top: 8px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 8px;
        }
        .chat-message .attachments img,
        .chat-message .attachments video {
            max-width: 150px;
            max-height: 120px;
            border-radius: 6px;
            border: 1px solid #374151;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .chat-message .attachments img:hover,
        .chat-message .attachments video:hover {
            transform: scale(1.05);
        }
        .chat-message .attachments a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.2);
            font-size: 12px;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .chat-message .attachments a:hover {
            background: rgba(0, 0, 0, 0.4);
        }
        .chat-input-area {
            display: flex;
            gap: 12px;
            padding: 16px 20px;
            border-top: 1px solid #1f2937;
            background: #0f151f;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px 16px;
            border-radius: 30px;
            border: 1px solid #2d3748;
            background: #0b0e14;
            color: #e5e7eb;
            font-size: 14px;
            transition: border-color 0.2s ease;
        }
        .chat-input-area input:focus {
            outline: none;
            border-color: #fbbf24;
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.1);
        }
        .chat-input-area .btn-primary {
            padding: 10px 24px;
            font-size: 14px;
            border-radius: 30px;
        }
        .file-input-wrapper {
            position: relative;
        }
        .file-input-wrapper input[type="file"] {
            display: none;
        }
        .file-preview {
            padding: 8px 16px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            border-top: 1px solid #1f2937;
            background: #0f151f;
            min-height: 40px;
            align-items: center;
        }
        .file-preview.empty {
            display: none;
        }
        .file-tag {
            background: #1f2937;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #e5e7eb;
            animation: slideIn 0.2s ease;
        }
        .file-tag .remove {
            cursor: pointer;
            color: #f87171;
            font-weight: 700;
            margin-left: 4px;
            transition: color 0.2s ease;
        }
        .file-tag .remove:hover {
            color: #ef4444;
        }

        /* ---------- EMPTY STATE ---------- */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #6b7280;
        }
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .empty-state h3 {
            color: #e5e7eb;
            margin-bottom: 4px;
        }
        .text-muted {
            color: #9ca3af;
        }
        .fs-14 {
            font-size: 14px;
        }

        .backtest-chart {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            height: 120px;
            padding: 20px 0;
            margin-top: 10px;
        }
        .backtest-chart .bar {
            flex: 1;
            background: linear-gradient(180deg, #fbbf24, #d97706);
            border-radius: 6px 6px 0 0;
            min-height: 8px;
            position: relative;
        }
        .backtest-chart .bar .val {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: #9ca3af;
            font-weight: 600;
        }

        .form-message {
            margin-top: 10px;
            font-weight: 500;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(251, 191, 36, 0.3);
            border-top-color: #fbbf24;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---------- TOAST ---------- */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1f2937;
            border: 1px solid #374151;
            padding: 16px 24px;
            border-radius: 16px;
            color: #e5e7eb;
            font-size: 14px;
            max-width: 380px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            z-index: 1000;
            animation: slideUp 0.4s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .toast .toast-icon {
            font-size: 20px;
            flex-shrink: 0;
        }
        .toast.success {
            border-color: #34d399;
        }
        .toast.success .toast-icon {
            color: #34d399;
        }
        .toast.error {
            border-color: #f87171;
        }
        .toast.error .toast-icon {
            color: #f87171;
        }
        .toast.info {
            border-color: #60a5fa;
        }
        .toast.info .toast-icon {
            color: #60a5fa;
        }
        @keyframes slideUp {
            from {
                transform: translateY(40px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* ---------- MODAL ---------- */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 90vh;
        }
        .modal-content img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 8px;
        }
        .modal-close {
            position: absolute;
            top: -40px;
            right: 0;
            background: none;
            border: none;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            transition: color 0.2s ease;
        }
        .modal-close:hover {
            color: #fbbf24;
        }

        /* ---------- LICENSE CARD ---------- */
        .license-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 16px;
        }
        .license-card {
            background: #141a24;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
        }
        .license-card:hover {
            border-color: #fbbf24;
            transform: translateY(-2px);
        }
        .license-card .lkey {
            font-family: 'Courier New', monospace;
            font-size: 16px;
            font-weight: 700;
            color: #fbbf24;
            letter-spacing: 1px;
        }
        .license-card .lstatus {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .license-card .lstatus.active {
            background: #065f46;
            color: #34d399;
        }
        .license-card .lstatus.inactive {
            background: #78350f;
            color: #fbbf24;
        }
        .license-card .lstatus.expired {
            background: #7f1d1d;
            color: #f87171;
        }
        .license-card .linfo {
            color: #9ca3af;
            font-size: 14px;
            margin-top: 8px;
        }
        .license-card .linfo span {
            color: #e5e7eb;
        }

        /* ---------- PAYMENT ---------- */
        .payment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }
        .payment-card {
            background: #141a24;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 20px 24px;
            transition: all 0.3s ease;
        }
        .payment-card:hover {
            border-color: #fbbf24;
        }
        .payment-card .pamount {
            font-size: 28px;
            font-weight: 800;
            color: #fbbf24;
        }
        .payment-card .pmethod {
            font-size: 13px;
            color: #9ca3af;
            margin: 4px 0;
        }
        .payment-card .pdate {
            font-size: 12px;
            color: #6b7280;
        }

        /* ---------- FOOTER ---------- */
        footer {
            border-top: 1px solid #1f2937;
            padding: 30px 0;
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-top: 20px;
        }
        footer a {
            color: #9ca3af;
            text-decoration: none;
            margin: 0 12px;
            transition: color 0.2s ease;
        }
        footer a:hover {
            color: #fbbf24;
        }

        @media (max-width: 900px) {
            .dash-wrapper {
                flex-direction: column;
            }
            .dash-sidebar {
                width: 100%;
                position: relative;
                top: 0;
                display: flex;
                flex-wrap: wrap;
                padding: 12px 16px;
                gap: 4px;
                border-radius: 16px;
            }
            .dash-sidebar .menu-item {
                padding: 8px 16px;
                border-left: none;
                border-radius: 8px;
                font-size: 13px;
                flex: 0 0 auto;
            }
            .dash-sidebar .menu-item.active {
                border-left: none;
                background: #fbbf24;
                color: #0b0e14;
            }
            header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .nav-links {
                justify-content: center;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (max-width: 500px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .product-grid {
                grid-template-columns: 1fr;
            }
            .license-grid {
                grid-template-columns: 1fr;
            }
            .payment-grid {
                grid-template-columns: 1fr;
            }
            .dash-sidebar .menu-item {
                font-size: 12px;
                padding: 6px 12px;
            }
            .dash-header h1 {
                font-size: 22px;
            }
            .chat-container {
                height: 350px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <header>
            <div class="logo" onclick="window.location.href='index.html'" role="button" tabindex="0">
                <span class="logo-icon">⚡</span> Trade<span>X</span>
            </div>
            <nav class="nav-links" id="mainNav" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="user-dashboard.html" style="color:#fbbf24;" aria-current="page">Dashboard</a>
                <div class="user-badge" id="userBadge" aria-label="User information">
                    <div class="avatar" id="userAvatar">U</div>
                    <span class="uname" id="userName">User</span>
                    <span class="role-tag">User</span>
                    <a href="login.html?logout=true" style="color:#f87171;font-size:13px;font-weight:500;" title="Logout">Logout</a>
                </div>
            </nav>
        </header>

        <!-- DASHBOARD -->
        <div class="dash-wrapper">
            <aside class="dash-sidebar" id="dashSidebar" role="navigation" aria-label="Dashboard menu"></aside>
            <main class="dash-content" id="dashContent" role="main"></main>
        </div>

        <!-- FOOTER -->
        <footer>
            <p><a href="#">Privacy</a> • <a href="#">Refund Policy</a> • <a href="#">Support</a></p>
            <p style="margin-top:12px;">© 2026 TradeX Robots. Not affiliated with MetaQuotes.</p>
        </footer>
    </div>

    <!-- Image Modal -->
    <div id="imageModal" class="modal" role="dialog" aria-hidden="true" aria-label="Image viewer">
        <div class="modal-content">
            <button class="modal-close" onclick="closeImageModal()" aria-label="Close">✕</button>
            <img id="modalImage" alt="Preview">
        </div>
    </div>

    <script src="db.js"></script>
    <script>
        // ============================================================
        //  DASHBOARD APP CLASS
        // ============================================================
        class DashboardApp {
            constructor() {
                this.currentUser = null;
                this.currentTab = 'overview';
                this.pendingAttachments = [];
                this.isLoading = false;

                this.validateEnvironment();
                this.init();
            }

            validateEnvironment() {
                if (typeof DB === 'undefined') {
                    console.error('DB object not found');
                    throw new Error('DB not initialized');
                }
            }

            init() {
                this.setupAuth();
                this.attachEventListeners();
                this.updateNav();
                this.renderDashboard();
            }

            setupAuth() {
                if (typeof requireAuth === 'function' && !requireAuth()) {
                    return;
                }
                this.currentUser = getCurrentUser();
                if (!this.currentUser) {
                    window.location.href = 'login.html';
                    return;
                }
                if (this.currentUser.role === 'admin') {
                    window.location.href = 'admin-dashboard.html';
                    return;
                }
            }

            attachEventListeners() {
                document.addEventListener('submit', (e) => this.handleFormSubmit(e));
                document.addEventListener('keydown', (e) => this.handleKeyPress(e));
                document.addEventListener('change', (e) => this.handleFileChange(e));
                document.addEventListener('visibilitychange', () => this.handleVisibilityChange());

                document.getElementById('imageModal').addEventListener('click', (e) => {
                    if (e.target === document.getElementById('imageModal')) {
                        this.closeImageModal();
                    }
                });
            }

            // ========== AUTH & NAV ==========
            updateNav() {
                if (this.currentUser) {
                    document.getElementById('userAvatar').textContent = this.currentUser.name.charAt(0).toUpperCase();
                    document.getElementById('userName').textContent = this.sanitize(this.currentUser.name);
                }
            }

            // ========== RENDERING ==========
            renderDashboard() {
                this.renderSidebar();
                this.renderContent();
            }

            renderSidebar() {
                const sidebar = document.getElementById('dashSidebar');
                const items = [
                    { id: 'overview', icon: '📊', label: 'Dashboard' },
                    { id: 'bots', icon: '🤖', label: 'Bots' },
                    { id: 'licenses', icon: '🔑', label: 'Licenses' },
                    { id: 'downloads', icon: '⬇️', label: 'Downloads' },
                    { id: 'orders', icon: '🛒', label: 'Orders' },
                    { id: 'payments', icon: '💳', label: 'Payments' },
                    { id: 'support', icon: '💬', label: 'Support' },
                    { id: 'profile', icon: '👤', label: 'Profile' },
                ];
                sidebar.innerHTML = items.map(item =>
                    `<div class="menu-item ${this.currentTab === item.id ? 'active' : ''}" onclick="dashApp.switchTab('${item.id}')" role="button" tabindex="0" aria-label="${item.label}">
                        <span class="icon" aria-hidden="true">${item.icon}</span> ${item.label}
                    </div>`
                ).join('');
            }

            switchTab(tab) {
                this.currentTab = tab;
                this.pendingAttachments = [];
                this.renderDashboard();
            }

            renderContent() {
                const container = document.getElementById('dashContent');
                let html = '';
                try {
                    switch (this.currentTab) {
                        case 'overview':
                            html = this.renderOverview();
                            break;
                        case 'bots':
                            html = this.renderBots();
                            break;
                        case 'licenses':
                            html = this.renderLicenses();
                            break;
                        case 'downloads':
                            html = this.renderDownloads();
                            break;
                        case 'orders':
                            html = this.renderOrders();
                            break;
                        case 'payments':
                            html = this.renderPayments();
                            break;
                        case 'support':
                            html = this.renderSupport();
                            break;
                        case 'profile':
                            html = this.renderProfile();
                            break;
                        default:
                            html = '<p>Page not found.</p>';
                    }
                    container.innerHTML = html;
                } catch (error) {
                    console.error('Error rendering content:', error);
                    container.innerHTML = this.renderEmptyState('⚠️', 'Error', 'Failed to load this section.');
                }
            }

            // ============================================================
            //  1. DASHBOARD (OVERVIEW)
            // ============================================================
            renderOverview() {
                const orders = this.getUserOrders();
                const completed = orders.filter(o => o.status === 'completed');
                const totalSpent = completed.reduce((sum, o) => sum + (o.amount || 0), 0);
                const products = DB.getProducts();
                const purchasedIds = completed.map(o => o.productId);
                const ownedProducts = products.filter(p => purchasedIds.includes(p.id));
                const licenses = this.getUserLicenses();
                const payments = this.getUserPayments();
                const greeting = this.getGreeting();

                return `
                    <div class="dash-header">
                        <div>
                            <h1>${greeting}, ${this.sanitize(this.currentUser.name)} 👋</h1>
                            <div class="sub">Your trading dashboard</div>
                        </div>
                        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                            <span style="color:#9ca3af;font-size:14px;background:#1f2937;padding:6px 16px;border-radius:30px;">Joined ${this.formatDate(this.currentUser.joinDate)}</span>
                            <button class="btn-primary small" onclick="dashApp.renderDashboard()" title="Refresh">🔄 Refresh</button>
                        </div>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-card gold-border"><div class="num">${completed.length}</div><div class="label">Purchases</div></div>
                        <div class="stat-card blue-border"><div class="num">$${totalSpent}</div><div class="label">Total Spent</div></div>
                        <div class="stat-card green-border"><div class="num">${ownedProducts.length}</div><div class="label">Bots Owned</div></div>
                        <div class="stat-card purple-border"><div class="num">${licenses.filter(l => l.status === 'active').length}</div><div class="label">Active Licenses</div></div>
                        <div class="stat-card red-border"><div class="num">${orders.filter(o => o.status === 'pending').length}</div><div class="label">Pending Orders</div></div>
                    </div>

                    <div style="display:flex;gap:12px;margin-top:12px;flex-wrap:wrap;">
                        <button class="btn-primary small" onclick="dashApp.switchTab('support')">💬 Contact Support</button>
                        <button class="btn-primary small" onclick="dashApp.switchTab('bots')">🤖 View Bots</button>
                        <button class="btn-outline small" onclick="dashApp.renderDashboard()">🔄 Refresh Data</button>
                    </div>

                    <h3 style="margin-top:24px;margin-bottom:8px;font-size:18px;">📦 Your Bots</h3>
                    ${ownedProducts.length === 0 ?
                        `<p style="color:#6b7280;">You haven't purchased any bots yet. <a href="index.html#pricing" style="color:#fbbf24;cursor:pointer;">Browse store</a></p>` :
                        `<div class="product-grid">${ownedProducts.map(p => `
                            <div class="product-card">
                                <div class="owned-badge">✓ Owned</div>
                                <div class="pname">${this.sanitize(p.name)}</div>
                                <div class="pprice">$${p.price}</div>
                                <div class="pdesc">${this.sanitize(p.desc || '')}</div>
                                <button class="btn-primary small" onclick="dashApp.switchTab('downloads')">Download</button>
                            </div>
                        `).join('')}</div>`
                    }
                `;
            }

            // ============================================================
            //  2. BOTS (MY PRODUCTS)
            // ============================================================
            renderBots() {
                const orders = this.getUserOrders();
                const completed = orders.filter(o => o.status === 'completed');
                const products = DB.getProducts();
                const purchasedIds = completed.map(o => o.productId);
                const owned = products.filter(p => purchasedIds.includes(p.id));

                if (owned.length === 0) {
                    return this.renderEmptyState('🤖', 'No Bots Purchased', 'Visit the pricing section to buy a trading bot.');
                }

                return `
                    <div class="dash-header"><h1>🤖 My Bots</h1></div>
                    <div class="product-grid">${owned.map(p => `
                        <div class="product-card">
                            <div class="owned-badge">✓ Owned</div>
                            <div class="pname">${this.sanitize(p.name)}</div>
                            <div class="pprice">$${p.price}</div>
                            <div class="pdesc">${this.sanitize(p.desc || '')}</div>
                            <div style="font-size:13px;color:#9ca3af;margin:6px 0;">
                                ${p.features ? p.features.slice(0,2).map(f => this.sanitize(f)).join(' • ') : ''}
                            </div>
                            <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px;">
                                <button class="btn-primary small" onclick="dashApp.switchTab('downloads')">⬇️ Download</button>
                                <button class="btn-ghost small" onclick="dashApp.switchTab('licenses')">🔑 License</button>
                            </div>
                        </div>
                    `).join('')}</div>
                `;
            }

            // ============================================================
            //  3. LICENSES
            // ============================================================
            renderLicenses() {
                const licenses = this.getUserLicenses();
                const products = DB.getProducts();

                if (licenses.length === 0) {
                    return this.renderEmptyState('🔑', 'No Licenses Found', 'Purchase a bot to receive a license key.');
                }

                return `
                    <div class="dash-header"><h1>🔑 My Licenses</h1></div>
                    <div class="license-grid">${licenses.map(l => {
                        const product = products.find(p => p.id === l.productId);
                        const statusClass = l.status === 'active' ? 'active' : l.status === 'expired' ? 'expired' : 'inactive';
                        return `
                            <div class="license-card" style="border-left-color: ${l.status === 'active' ? '#34d399' : l.status === 'expired' ? '#f87171' : '#fbbf24'};">
                                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
                                    <div class="lkey">${this.sanitize(l.key)}</div>
                                    <span class="lstatus ${statusClass}">${l.status.toUpperCase()}</span>
                                </div>
                                <div class="linfo">Product: <span>${product ? this.sanitize(product.name) : 'Unknown'}</span></div>
                                <div class="linfo">Expires: <span>${l.expiryDate ? this.formatDate(l.expiryDate) : 'Never'}</span></div>
                                <div class="linfo">Activations: <span>${l.usedActivations || 0} / ${l.maxActivations || 1}</span></div>
                                <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
                                    <button class="btn-ghost small" onclick="dashApp.showToast('License key copied to clipboard!', 'success')">📋 Copy</button>
                                    <button class="btn-outline small" onclick="dashApp.switchTab('downloads')">⬇️ Download</button>
                                </div>
                            </div>
                        `;
                    }).join('')}</div>
                `;
            }

            // ============================================================
            //  4. DOWNLOADS
            // ============================================================
            renderDownloads() {
                const completed = this.getUserOrders().filter(o => o.status === 'completed');
                const products = DB.getProducts();
                const owned = products.filter(p => completed.some(o => o.productId === p.id));

                if (owned.length === 0) {
                    return this.renderEmptyState('⬇️', 'No Downloads Available', 'Purchase a bot to access download links.');
                }

                return `
                    <div class="dash-header"><h1>⬇️ Downloads</h1></div>
                    <div class="product-grid">${owned.map(p => `
                        <div class="product-card">
                            <div class="pname">${this.sanitize(p.name)}</div>
                            <div class="pdesc">${this.sanitize(p.desc || '')}</div>
                            <div style="font-size:13px;color:#9ca3af;margin:6px 0;">Version: 2.0.1 • Size: 4.2 MB</div>
                            <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
                                <button class="btn-primary small" onclick="dashApp.downloadFile('${this.sanitize(p.name)}')">⬇️ Download .ex5</button>
                                <button class="btn-outline small" onclick="dashApp.downloadFile('${this.sanitize(p.name)}-docs')">📄 Documentation</button>
                            </div>
                            <div style="font-size:12px;color:#6b7280;margin-top:8px;">Downloaded ${Math.floor(Math.random() * 10)} times</div>
                        </div>
                    `).join('')}</div>
                `;
            }

            // ============================================================
            //  5. ORDERS
            // ============================================================
            renderOrders() {
                const orders = this.getUserOrders();
                const products = DB.getProducts();

                if (orders.length === 0) {
                    return this.renderEmptyState('🛒', 'No Orders', 'You haven\'t placed any orders yet.');
                }

                return `
                    <div class="dash-header"><h1>🛒 My Orders</h1></div>
                    <div class="table-wrap">
                        <table>
                            <thead><tr><th>Order ID</th><th>Product</th><th>Amount</th><th>Date</th><th>Status</th></tr></thead>
                            <tbody>${orders.map(o => {
                                const p = products.find(x => x.id === o.productId);
                                const statusClass = o.status === 'completed' ? 'green' : o.status === 'pending' ? 'yellow' : 'red';
                                return `<tr>
                                    <td style="font-family:monospace;font-size:13px;">#${o.id.slice(0,8).toUpperCase()}</td>
                                    <td>${this.sanitize(p ? p.name : 'Unknown')}</td>
                                    <td>$${o.amount || 0}</td>
                                    <td>${this.formatDate(o.date)}</td>
                                    <td><span class="badge ${statusClass}">${o.status}</span></td>
                                </tr>`;
                            }).join('')}</tbody>
                        </table>
                    </div>
                `;
            }

            // ============================================================
            //  6. PAYMENTS
            // ============================================================
            renderPayments() {
                const payments = this.getUserPayments();

                if (payments.length === 0) {
                    return this.renderEmptyState('💳', 'No Payments', 'Your payment history will appear here.');
                }

                return `
                    <div class="dash-header"><h1>💳 Payment History</h1></div>
                    <div class="payment-grid">${payments.map(p => `
                        <div class="payment-card">
                            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
                                <div class="pamount">$${p.amount}</div>
                                <span class="badge ${p.status === 'completed' ? 'green' : p.status === 'pending' ? 'yellow' : 'red'}">${p.status}</span>
                            </div>
                            <div class="pmethod">${p.method || 'Credit Card'} • ${p.last4 ? `•••• ${p.last4}` : ''}</div>
                            <div class="pdate">${this.formatDate(p.date)}</div>
                            <div style="font-size:12px;color:#6b7280;margin-top:4px;">Order: #${p.orderId?.slice(0,6).toUpperCase() || 'N/A'}</div>
                            ${p.receiptUrl ? `<button class="btn-ghost small" style="margin-top:8px;" onclick="dashApp.showToast('Receipt downloaded!', 'success')">📄 Download Receipt</button>` : ''}
                        </div>
                    `).join('')}</div>
                `;
            }

            // ============================================================
            //  7. SUPPORT (CHAT)
            // ============================================================
            renderSupport() {
                const conversationId = this.currentUser.id;
                const messages = DB.getMessagesForConversation(conversationId);

                return `
                    <div class="dash-header"><h1>💬 Support Chat</h1></div>
                    <div class="chat-container">
                        <div class="chat-messages" id="userChatMessages" role="log" aria-label="Messages">
                            ${messages.length === 0 ?
                                '<p style="color:#6b7280;text-align:center;padding:20px;">No messages yet. Start a conversation with support.</p>' :
                                messages.map(m => `
                                    <div class="chat-message ${m.sender}" role="article">
                                        <div>${this.sanitize(m.text) || '<em>📎 File attachment</em>'}</div>
                                        ${m.attachments && m.attachments.length > 0 ? this.renderAttachments(m.attachments) : ''}
                                        <div class="meta">
                                            <span>${m.sender === 'user' ? 'You' : 'Support'}</span>
                                            <span>${this.formatDate(m.timestamp)}</span>
                                        </div>
                                    </div>
                                `).join('')
                            }
                        </div>
                        <div class="file-preview empty" id="filePreview"></div>
                        <div class="chat-input-area">
                            <div class="file-input-wrapper">
                                <button class="btn-outline" onclick="dashApp.triggerFileInput()" title="Attach files" style="padding:8px 12px;cursor:pointer;">📎</button>
                                <input type="file" id="chatFileInput" multiple accept="image/*,video/*,.pdf,.doc,.docx,.zip,.txt" />
                            </div>
                            <input type="text" id="userChatInput" placeholder="Type your message..." />
                            <button class="btn-primary" id="sendChatBtn" onclick="dashApp.sendUserMessage()">Send</button>
                        </div>
                    </div>
                `;
            }

            // ============================================================
            //  8. PROFILE
            // ============================================================
            renderProfile() {
                return `
                    <div class="dash-header"><h1>👤 Profile Settings</h1></div>
                    <div style="background:#141a24;border:1px solid #1f2937;border-radius:16px;padding:30px;max-width:500px;">
                        <form id="profileForm">
                            <div class="form-group">
                                <label for="profName">Full Name</label>
                                <input type="text" id="profName" value="${this.sanitize(this.currentUser.name)}" required />
                            </div>
                            <div class="form-group">
                                <label for="profEmail">Email</label>
                                <input type="email" id="profEmail" value="${this.sanitize(this.currentUser.email)}" required />
                            </div>
                            <div class="form-group">
                                <label for="profPass">New Password (leave blank to keep current)</label>
                                <input type="password" id="profPass" placeholder="New password" />
                            </div>
                            <button type="submit" class="btn-primary">Update Profile</button>
                        </form>
                        <div id="profileMsg" class="form-message"></div>
                    </div>
                `;
            }

            // ============================================================
            //  CHAT HELPERS
            // ============================================================
            triggerFileInput() {
                document.getElementById('chatFileInput').click();
            }

            handleFileChange(e) {
                if (e.target.id === 'chatFileInput') {
                    this.handleFileSelection(e);
                }
            }

            handleFileSelection(e) {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                const maxTotalSize = 5 * 1024 * 1024;
                const maxFileSize = 2 * 1024 * 1024;
                const maxFiles = 5;

                if (this.pendingAttachments.length + files.length > maxFiles) {
                    this.showToast(`Maximum ${maxFiles} files per message.`, 'error');
                    e.target.value = '';
                    return;
                }

                let totalSize = this.pendingAttachments.reduce((sum, f) => sum + f.size, 0);

                for (let file of files) {
                    if (file.size > maxFileSize) {
                        this.showToast(`File "${this.sanitize(file.name)}" exceeds 2MB limit.`, 'error');
                        e.target.value = '';
                        return;
                    }
                    totalSize += file.size;
                    if (totalSize > maxTotalSize) {
                        this.showToast('Total attachment size exceeds 5MB limit.', 'error');
                        e.target.value = '';
                        return;
                    }
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        this.pendingAttachments.push({
                            name: file.name,
                            type: file.type,
                            data: ev.target.result,
                            size: file.size
                        });
                        this.renderFilePreview();
                    };
                    reader.onerror = () => {
                        this.showToast(`Failed to read file "${this.sanitize(file.name)}"`, 'error');
                    };
                    reader.readAsDataURL(file);
                }
                e.target.value = '';
            }

            renderFilePreview() {
                const preview = document.getElementById('filePreview');
                if (!preview) return;
                if (this.pendingAttachments.length === 0) {
                    preview.classList.add('empty');
                    preview.innerHTML = '';
                    return;
                }
                preview.classList.remove('empty');
                preview.innerHTML = this.pendingAttachments.map((f, i) => `
                    <div class="file-tag">
                        📎 ${this.sanitize(f.name)} (${(f.size / 1024).toFixed(0)}KB)
                        <span class="remove" onclick="dashApp.removeAttachment(${i})" role="button" tabindex="0">✕</span>
                    </div>
                `).join('');
            }

            removeAttachment(index) {
                this.pendingAttachments.splice(index, 1);
                this.renderFilePreview();
            }

            renderAttachments(attachments) {
                return `<div class="attachments">${attachments.map(att => {
                    if (att.type.startsWith('image/')) {
                        return `<a href="javascript:void(0)" onclick="dashApp.openImageModal('${att.data.replace(/'/g, "\\'")}')"><img src="${att.data}" alt="${this.sanitize(att.name)}" loading="lazy" /></a>`;
                    } else if (att.type.startsWith('video/')) {
                        return `<video controls style="max-width:150px;max-height:120px;border-radius:6px;border:1px solid #374151;"><source src="${att.data}" type="${att.type}"></video>`;
                    } else {
                        return `<a href="${att.data}" download="${this.sanitize(att.name)}">📎 ${this.sanitize(att.name)}</a>`;
                    }
                }).join('')}</div>`;
            }

            sendUserMessage() {
                if (this.isLoading) return;
                const input = document.getElementById('userChatInput');
                const text = (input?.value || '').trim();
                if (!text && this.pendingAttachments.length === 0) {
                    this.showToast('Message cannot be empty.', 'info');
                    return;
                }
                const sendBtn = document.getElementById('sendChatBtn');
                this.setButtonLoading(sendBtn, true);

                try {
                    const attachments = this.pendingAttachments.map(f => ({
                        name: f.name,
                        type: f.type,
                        data: f.data,
                        size: f.size
                    }));
                    DB.addMessage(this.currentUser.id, 'user', text, attachments);
                    this.pendingAttachments = [];
                    this.renderFilePreview();
                    if (input) input.value = '';
                    this.renderSupport();
                    this.showToast('Message sent successfully!', 'success');
                    setTimeout(() => {
                        const container = document.getElementById('userChatMessages');
                        if (container) container.scrollTop = container.scrollHeight;
                    }, 100);
                } catch (error) {
                    console.error('Error sending message:', error);
                    this.showToast('Failed to send message.', 'error');
                } finally {
                    this.setButtonLoading(sendBtn, false);
                }
            }

            // ============================================================
            //  PROFILE FORM HANDLER
            // ============================================================
            handleFormSubmit(e) {
                if (e.target.id === 'profileForm') {
                    e.preventDefault();
                    const name = document.getElementById('profName').value.trim();
                    const email = document.getElementById('profEmail').value.trim();
                    const pass = document.getElementById('profPass').value.trim();
                    const msg = document.getElementById('profileMsg');

                    if (!name || !email) {
                        msg.textContent = 'Name and email are required.';
                        msg.style.color = '#f87171';
                        return;
                    }

                    const users = DB.getUsers();
                    const u = users.find(x => x.id === this.currentUser.id);
                    if (!u) return;

                    const other = users.find(x => x.email === email && x.id !== this.currentUser.id);
                    if (other) {
                        msg.textContent = 'Email already in use.';
                        msg.style.color = '#f87171';
                        return;
                    }

                    u.name = name;
                    u.email = email;
                    if (pass) u.password = pass;
                    DB.setUsers(users);
                    this.currentUser = u;
                    DB.setSession({ userId: u.id, email: u.email, role: u.role });

                    msg.textContent = '✅ Profile updated successfully!';
                    msg.style.color = '#34d399';
                    this.updateNav();
                    setTimeout(() => { msg.textContent = ''; }, 3000);
                }
            }

            // ============================================================
            //  DATA HELPERS
            // ============================================================
            getUserOrders() {
                return DB.getOrders().filter(o => o.userId === this.currentUser.id);
            }

            getUserLicenses() {
                // Generate demo licenses if none exist
                const orders = this.getUserOrders().filter(o => o.status === 'completed');
                const existing = DB.getLicenses ? DB.getLicenses().filter(l => l.userId === this.currentUser.id) : [];

                // If no licenses exist yet, generate them from completed orders
                if (existing.length === 0 && orders.length > 0) {
                    const newLicenses = orders.map(o => {
                        const key = 'TRX-' + Math.random().toString(36).substring(2, 10).toUpperCase() +
                            '-' + Math.random().toString(36).substring(2, 10).toUpperCase();
                        return {
                            id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                            userId: this.currentUser.id,
                            productId: o.productId,
                            key: key,
                            status: 'active',
                            expiryDate: new Date(Date.now() + 365 * 24 * 60 * 60 * 1000).toISOString(),
                            maxActivations: 2,
                            usedActivations: 1,
                            createdAt: new Date().toISOString()
                        };
                    });
                    if (DB.setLicenses) {
                        const all = DB.getLicenses() || [];
                        DB.setLicenses([...all, ...newLicenses]);
                    }
                    return newLicenses;
                }

                return existing;
            }

            getUserPayments() {
                // Generate demo payments if none exist
                const orders = this.getUserOrders();
                const existing = DB.getPayments ? DB.getPayments().filter(p => p.userId === this.currentUser.id) : [];

                if (existing.length === 0 && orders.length > 0) {
                    const newPayments = orders.filter(o => o.status === 'completed').map(o => ({
                        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                        userId: this.currentUser.id,
                        orderId: o.id,
                        amount: o.amount || 299,
                        method: 'Credit Card',
                        last4: '4242',
                        status: 'completed',
                        date: o.date || new Date().toISOString(),
                        receiptUrl: '#'
                    }));
                    if (DB.setPayments) {
                        const all = DB.getPayments() || [];
                        DB.setPayments([...all, ...newPayments]);
                    }
                    return newPayments;
                }
                return existing;
            }

            // ============================================================
            //  UTILITIES
            // ============================================================
            downloadFile(fileName) {
                this.showToast(`⬇️ Download started: ${this.sanitize(fileName)}`, 'success');
            }

            openImageModal(dataUrl) {
                const modal = document.getElementById('imageModal');
                const img = document.getElementById('modalImage');
                img.src = dataUrl;
                modal.classList.add('active');
                modal.setAttribute('aria-hidden', 'false');
            }

            closeImageModal() {
                const modal = document.getElementById('imageModal');
                modal.classList.remove('active');
                modal.setAttribute('aria-hidden', 'true');
                document.getElementById('modalImage').src = '';
            }

            formatDate(timestamp) {
                if (!timestamp) return 'N/A';
                const dt = new Date(timestamp);
                return dt.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: true
                });
            }

            getGreeting() {
                const hour = new Date().getHours();
                if (hour < 12) return 'Good Morning';
                if (hour < 18) return 'Good Afternoon';
                return 'Good Evening';
            }

            sanitize(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            renderEmptyState(icon, title, message) {
                return `
                    <div class="empty-state">
                        <div class="icon">${icon}</div>
                        <h3>${title}</h3>
                        <p class="text-muted">${message}</p>
                    </div>
                `;
            }

            showToast(message, type = 'info') {
                const existing = document.querySelector('.toast');
                if (existing) existing.remove();
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                const icons = { success: '✅', error: '❌', info: 'ℹ️' };
                toast.innerHTML = `
                    <span class="toast-icon" aria-hidden="true">${icons[type] || 'ℹ️'}</span>
                    <span>${this.sanitize(message)}</span>
                `;
                toast.setAttribute('role', 'status');
                toast.setAttribute('aria-live', 'polite');
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 4000);
            }

            setButtonLoading(btn, isLoading) {
                if (!btn) return;
                this.isLoading = isLoading;
                btn.disabled = isLoading;
                if (isLoading) {
                    btn.innerHTML = '<span class="spinner"></span>';
                } else {
                    btn.textContent = 'Send';
                }
            }

            handleKeyPress(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    const chatInput = document.getElementById('userChatInput');
                    if (document.activeElement === chatInput) {
                        e.preventDefault();
                        this.sendUserMessage();
                    }
                }
            }

            handleVisibilityChange() {
                if (!document.hidden) {
                    this.renderDashboard();
                }
            }
        }

        // ============================================================
        //  INITIALIZE APP
        // ============================================================
        let dashApp;
        document.addEventListener('DOMContentLoaded', () => {
            try {
                dashApp = new DashboardApp();
            } catch (error) {
                console.error('Failed to initialize DashboardApp:', error);
                document.getElementById('dashContent').innerHTML = `
                    <div class="empty-state">
                        <div class="icon">⚠️</div>
                        <h3>Application Error</h3>
                        <p class="text-muted">Failed to load dashboard. Please refresh and try again.</p>
                    </div>
                `;
            }
        });

        function closeImageModal() {
            dashApp?.closeImageModal();
        }
    </script>
</body>
</html>
