<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeX – Admin Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #0b0e14;
            color: #e8edf5;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        .hidden {
            display: none !important;
        }

        /* ---------- BUTTONS ---------- */
        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0b0e14;
            padding: 14px 36px;
            border-radius: 40px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
            box-shadow: 0 8px 30px rgba(251, 191, 36, 0.25);
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 16px 40px rgba(251, 191, 36, 0.4);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-primary.small {
            padding: 10px 24px;
            font-size: 14px;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #4b5563;
            color: #e5e7eb;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        .btn-outline:hover:not(:disabled) {
            border-color: #fbbf24;
            color: #fbbf24;
        }
        .btn-outline:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-danger {
            background: #dc2626;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        .btn-danger:hover:not(:disabled) {
            background: #b91c1c;
        }
        .btn-danger:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-success {
            background: #16a34a;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        .btn-success:hover:not(:disabled) {
            background: #15803d;
        }
        .btn-success:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-ghost {
            background: transparent;
            color: #fbbf24;
            border: 1px solid #fbbf24;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 13px;
        }
        .btn-ghost:hover {
            background: rgba(251, 191, 36, 0.1);
        }

        /* ---------- HEADER ---------- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid rgba(31, 41, 55, 0.6);
            flex-wrap: wrap;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(11, 14, 20, 0.95);
            backdrop-filter: blur(4px);
        }
        .logo {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s ease;
        }
        .logo:hover {
            transform: scale(1.05);
        }
        .logo span {
            color: #6b7280;
            font-weight: 400;
            background: none;
            -webkit-text-fill-color: #6b7280;
        }
        .logo-icon {
            font-size: 28px;
            -webkit-text-fill-color: initial;
            color: #fbbf24;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: #9ca3af;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.2s ease;
            cursor: pointer;
            padding: 6px 0;
            border-bottom: 2px solid transparent;
        }
        .nav-links a:hover {
            color: #fbbf24;
            border-bottom-color: #fbbf24;
        }
        .user-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1f2937;
            padding: 6px 16px 6px 12px;
            border-radius: 30px;
            border: 1px solid #374151;
        }
        .user-badge .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #0b0e14;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
        }
        .user-badge .uname {
            font-size: 14px;
            color: #e5e7eb;
            font-weight: 500;
        }
        .user-badge .role-tag {
            font-size: 10px;
            text-transform: uppercase;
            background: #fbbf24;
            padding: 2px 10px;
            border-radius: 20px;
            color: #0b0e14;
            letter-spacing: 0.5px;
        }

        /* ---------- DASHBOARD LAYOUT ---------- */
        .dash-wrapper {
            display: flex;
            gap: 30px;
            padding: 30px 0;
            min-height: 70vh;
        }
        .dash-sidebar {
            width: 220px;
            flex-shrink: 0;
            background: #141a24;
            border-radius: 20px;
            border: 1px solid #1f2937;
            padding: 16px 0;
            height: fit-content;
            position: sticky;
            top: 80px;
        }
        .dash-sidebar .menu-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 20px;
            color: #9ca3af;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }
        .dash-sidebar .menu-item:hover {
            color: #e5e7eb;
            background: #1a212d;
        }
        .dash-sidebar .menu-item.active {
            color: #fbbf24;
            border-left-color: #fbbf24;
            background: rgba(251, 191, 36, 0.08);
        }
        .dash-sidebar .menu-item .icon {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }
        .dash-sidebar .badge-indicator {
            margin-left: auto;
            background: #dc2626;
            color: #fff;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        /* ---------- DASHBOARD CARDS ---------- */
        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
        }
        .dash-header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .dash-header .sub {
            color: #9ca3af;
            font-size: 15px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #141a24;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 20px 24px;
            border-top: 2px solid transparent;
            transition: all 0.3s ease;
        }
        .stat-card:hover {
            border-color: #fbbf24;
            transform: translateY(-2px);
        }
        .stat-card .num {
            font-size: 32px;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
        }
        .stat-card .label {
            font-size: 14px;
            color: #9ca3af;
            margin-top: 2px;
        }
        .stat-card.gold-border {
            border-top-color: #fbbf24;
        }
        .stat-card.blue-border {
            border-top-color: #3b82f6;
        }
        .stat-card.green-border {
            border-top-color: #34d399;
        }
        .stat-card.purple-border {
            border-top-color: #a78bfa;
        }
        .stat-card.red-border {
            border-top-color: #f87171;
        }

        /* ---------- TABLES ---------- */
        .table-wrap {
            background: #141a24;
            border: 1px solid #1f2937;
            border-radius: 16px;
            overflow: hidden;
            margin-top: 16px;
            overflow-x: auto;
        }
        .table-wrap table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 600px;
        }
        .table-wrap th {
            text-align: left;
            padding: 14px 20px;
            background: #0f151f;
            color: #9ca3af;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #1f2937;
        }
        .table-wrap td {
            padding: 14px 20px;
            border-bottom: 1px solid #1f2937;
            color: #e5e7eb;
        }
        .table-wrap tr:last-child td {
            border-bottom: none;
        }
        .table-wrap tr:hover td {
            background: #1a212d;
        }
        .badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge.green {
            background: #065f46;
            color: #34d399;
        }
        .badge.yellow {
            background: #78350f;
            color: #fbbf24;
        }
        .badge.blue {
            background: #1e3a5f;
            color: #60a5fa;
        }
        .badge.red {
            background: #7f1d1d;
            color: #f87171;
        }
        .badge.purple {
            background: #4c1d95;
            color: #a78bfa;
        }
        .badge.gray {
            background: #374151;
            color: #9ca3af;
        }

        /* ---------- FORMS ---------- */
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #d1d5db;
            margin-bottom: 4px;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid #2d3748;
            background: #0b0e14;
            color: #e5e7eb;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #fbbf24;
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.1);
        }
        .form-group select option {
            background: #141a24;
        }

        /* ---------- EMPTY STATE ---------- */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #6b7280;
        }
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .empty-state h3 {
            color: #e5e7eb;
            margin-bottom: 4px;
        }
        .text-muted {
            color: #9ca3af;
        }
        .fs-12 {
            font-size: 12px;
        }
        .fs-14 {
            font-size: 14px;
        }

        /* ---------- LOADING SPINNER ---------- */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(251, 191, 36, 0.3);
            border-top-color: #fbbf24;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ---------- TOAST ---------- */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1f2937;
            border: 1px solid #374151;
            padding: 16px 24px;
            border-radius: 16px;
            color: #e5e7eb;
            font-size: 14px;
            max-width: 380px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            z-index: 1000;
            animation: slideUp 0.4s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .toast .toast-icon {
            font-size: 20px;
            flex-shrink: 0;
        }
        .toast.success {
            border-color: #34d399;
        }
        .toast.success .toast-icon {
            color: #34d399;
        }
        .toast.error {
            border-color: #f87171;
        }
        .toast.error .toast-icon {
            color: #f87171;
        }
        .toast.info {
            border-color: #60a5fa;
        }
        .toast.info .toast-icon {
            color: #60a5fa;
        }
        @keyframes slideUp {
            from {
                transform: translateY(40px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* ---------- MODAL ---------- */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-box {
            background: #141a24;
            border: 1px solid #2d3748;
            border-radius: 24px;
            max-width: 520px;
            width: 100%;
            padding: 32px 36px;
            position: relative;
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from {
                transform: scale(0.95) translateY(20px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }
        .modal-box .close-modal {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 28px;
            cursor: pointer;
            color: #6b7280;
            transition: color 0.2s ease;
            background: none;
            border: none;
        }
        .modal-box .close-modal:hover {
            color: #f87171;
        }
        .modal-box h2 {
            font-size: 24px;
            margin-bottom: 16px;
            color: #fbbf24;
        }

        /* ---------- LICENSE CARD ---------- */
        .license-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 16px;
        }
        .license-card {
            background: #141a24;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
        }
        .license-card:hover {
            border-color: #fbbf24;
            transform: translateY(-2px);
        }
        .license-card .lkey {
            font-family: 'Courier New', monospace;
            font-size: 16px;
            font-weight: 700;
            color: #fbbf24;
            letter-spacing: 1px;
        }
        .license-card .linfo {
            color: #9ca3af;
            font-size: 14px;
            margin-top: 6px;
        }
        .license-card .linfo span {
            color: #e5e7eb;
        }

        /* ---------- PAYMENT CARD ---------- */
        .payment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }
        .payment-card {
            background: #141a24;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 20px 24px;
            transition: all 0.3s ease;
        }
        .payment-card:hover {
            border-color: #fbbf24;
        }
        .payment-card .pamount {
            font-size: 28px;
            font-weight: 800;
            color: #fbbf24;
        }

        /* ---------- SUPPORT TICKETS ---------- */
        .ticket-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 16px;
        }
        .ticket-item {
            background: #141a24;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .ticket-item:hover {
            border-color: #fbbf24;
        }
        .ticket-item .ticket-info {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .ticket-item .ticket-user {
            font-weight: 600;
        }
        .ticket-item .ticket-subject {
            color: #9ca3af;
            font-size: 14px;
        }
        .ticket-item .ticket-time {
            color: #6b7280;
            font-size: 12px;
        }

        /* ---------- CHAT (Support) ---------- */
        .chat-container {
            display: flex;
            flex-direction: column;
            background: #141a24;
            border: 1px solid #1f2937;
            border-radius: 16px;
            overflow: hidden;
            height: 480px;
            margin-top: 16px;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
        }
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: #0b0e14;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 3px;
        }
        .chat-message {
            max-width: 75%;
            padding: 10px 16px;
            border-radius: 12px;
            word-break: break-word;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .chat-message.user {
            align-self: flex-end;
            background: #fbbf24;
            color: #0b0e14;
            border-bottom-right-radius: 4px;
        }
        .chat-message.admin {
            align-self: flex-start;
            background: #1f2937;
            color: #e5e7eb;
            border-bottom-left-radius: 4px;
        }
        .chat-message .meta {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }
        .chat-message.user .meta {
            color: #78350f;
        }
        .chat-message .attachments {
            margin-top: 8px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 8px;
        }
        .chat-message .attachments img,
        .chat-message .attachments video {
            max-width: 150px;
            max-height: 120px;
            border-radius: 6px;
            border: 1px solid #374151;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .chat-message .attachments img:hover,
        .chat-message .attachments video:hover {
            transform: scale(1.05);
        }
        .chat-message .attachments a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.2);
            font-size: 12px;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .chat-message .attachments a:hover {
            background: rgba(0, 0, 0, 0.4);
        }

        .chat-input-area {
            display: flex;
            gap: 12px;
            padding: 16px 20px;
            border-top: 1px solid #1f2937;
            background: #0f151f;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px 16px;
            border-radius: 30px;
            border: 1px solid #2d3748;
            background: #0b0e14;
            color: #e5e7eb;
            font-size: 14px;
            transition: border-color 0.2s ease;
        }
        .chat-input-area input:focus {
            outline: none;
            border-color: #fbbf24;
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.1);
        }
        .chat-input-area .btn-primary {
            padding: 10px 24px;
            font-size: 14px;
            border-radius: 30px;
        }

        .file-input-wrapper {
            position: relative;
        }
        .file-input-wrapper input[type="file"] {
            display: none;
        }
        .file-preview {
            padding: 8px 16px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            border-top: 1px solid #1f2937;
            background: #0f151f;
            min-height: 40px;
            align-items: center;
        }
        .file-preview.empty {
            display: none;
        }
        .file-tag {
            background: #1f2937;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #e5e7eb;
            animation: slideIn 0.2s ease;
        }
        .file-tag .remove {
            cursor: pointer;
            color: #f87171;
            font-weight: 700;
            margin-left: 4px;
            transition: color 0.2s ease;
        }
        .file-tag .remove:hover {
            color: #ef4444;
        }

        /* ---------- FOOTER ---------- */
        footer {
            border-top: 1px solid #1f2937;
            padding: 30px 0;
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-top: 20px;
        }
        footer a {
            color: #9ca3af;
            text-decoration: none;
            margin: 0 12px;
            transition: color 0.2s ease;
        }
        footer a:hover {
            color: #fbbf24;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 900px) {
            .dash-wrapper {
                flex-direction: column;
            }
            .dash-sidebar {
                width: 100%;
                position: relative;
                top: 0;
                display: flex;
                flex-wrap: wrap;
                padding: 12px 16px;
                gap: 4px;
                border-radius: 16px;
            }
            .dash-sidebar .menu-item {
                padding: 8px 16px;
                border-left: none;
                border-radius: 8px;
                font-size: 13px;
                flex: 0 0 auto;
            }
            .dash-sidebar .menu-item.active {
                border-left: none;
                background: #fbbf24;
                color: #0b0e14;
            }
            header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .nav-links {
                justify-content: center;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (max-width: 500px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .dash-sidebar .menu-item {
                font-size: 12px;
                padding: 6px 12px;
            }
            .dash-header h1 {
                font-size: 22px;
            }
            .table-wrap {
                overflow-x: auto;
            }
            .chat-container {
                height: 350px;
            }
            .modal-box {
                padding: 24px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <header>
            <div class="logo" onclick="window.location.href='index.html'" role="button" tabindex="0">
                <span class="logo-icon">⚡</span> Trade<span>X</span>
            </div>
            <nav class="nav-links" id="mainNav" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="admin-dashboard.html" style="color:#fbbf24;" aria-current="page">⚙️ Admin</a>
                <div class="user-badge" id="userBadge" aria-label="User information">
                    <div class="avatar" id="userAvatar">A</div>
                    <span class="uname" id="userName">Admin</span>
                    <span class="role-tag">Admin</span>
                    <a href="login.html?logout=true" style="color:#f87171;font-size:13px;font-weight:500;" title="Logout">Logout</a>
                </div>
            </nav>
        </header>

        <!-- DASHBOARD -->
        <div class="dash-wrapper">
            <aside class="dash-sidebar" id="dashSidebar" role="navigation" aria-label="Dashboard menu"></aside>
            <main class="dash-content" id="dashContent" role="main"></main>
        </div>

        <!-- FOOTER -->
        <footer>
            <p><a href="#">Privacy</a> • <a href="#">Refund Policy</a> • <a href="#">Support</a></p>
            <p style="margin-top:12px;">© 2026 TradeX Robots. Not affiliated with MetaQuotes.</p>
        </footer>
    </div>

    <!-- IMAGE MODAL -->
    <div id="imageModal" class="modal-overlay" onclick="if(event.target===this) adminApp.closeImageModal()">
        <div class="modal-box" style="max-width:90%;background:transparent;border:none;padding:0;">
            <button class="close-modal" onclick="adminApp.closeImageModal()" style="color:#fff;font-size:32px;top:-40px;right:0;">✕</button>
            <img id="modalImage" alt="Preview" style="max-width:100%;max-height:80vh;border-radius:8px;display:block;margin:0 auto;">
        </div>
    </div>

    <!-- GENERIC MODAL -->
    <div class="modal-overlay" id="genericModal">
        <div class="modal-box">
            <button class="close-modal" onclick="adminApp.closeModal()">✕</button>
            <h2 id="modalTitle">Modal</h2>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="db.js"></script>
    <script>
        // ============================================================
        //  ADMIN DASHBOARD APP CLASS
        // ============================================================
        class AdminDashboardApp {
            constructor() {
                this.currentUser = null;
                this.currentTab = 'overview';
                this.selectedTicketId = null;
                this.pendingAttachments = [];
                this.isLoading = false;

                this.validateEnvironment();
                this.init();
            }

            validateEnvironment() {
                if (typeof DB === 'undefined') {
                    console.error('DB object not found');
                    throw new Error('DB not initialized');
                }
                this.extendDB();
            }

            // ============================================================
            //  EXTEND DB WITH MISSING FUNCTIONS
            // ============================================================
            extendDB() {
                // Licenses
                if (!DB._licenses) DB._licenses = [];
                if (!DB.getLicenses) DB.getLicenses = function() { return this._licenses || []; };
                if (!DB.setLicenses) DB.setLicenses = function(l) { this._licenses = l; };

                // Payments
                if (!DB._payments) DB._payments = [];
                if (!DB.getPayments) DB.getPayments = function() { return this._payments || []; };
                if (!DB.setPayments) DB.setPayments = function(p) { this._payments = p; };

                // Support Tickets
                if (!DB._tickets) DB._tickets = [];
                if (!DB.getTickets) DB.getTickets = function() { return this._tickets || []; };
                if (!DB.setTickets) DB.setTickets = function(t) { this._tickets = t; };

                // Messages (already exists but ensure)
                if (!DB._messages) DB._messages = {};
                if (!DB.getMessagesForConversation) {
                    DB.getMessagesForConversation = function(userId) {
                        return this._messages[userId] || [];
                    };
                }
                if (!DB.addMessage) {
                    DB.addMessage = function(userId, sender, text, attachments) {
                        if (!this._messages[userId]) this._messages[userId] = [];
                        this._messages[userId].push({
                            id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                            sender: sender,
                            text: text || '',
                            attachments: attachments || [],
                            timestamp: new Date().toISOString()
                        });
                    };
                }
                if (!DB.getMessages) {
                    DB.getMessages = function() {
                        const all = [];
                        for (const key in this._messages) {
                            for (const msg of this._messages[key]) {
                                all.push({ ...msg, conversationId: key });
                            }
                        }
                        return all;
                    };
                }
                if (!DB.setMessages) {
                    DB.setMessages = function(msgs) {
                        this._messages = {};
                        for (const m of msgs) {
                            if (!this._messages[m.conversationId]) this._messages[m.conversationId] = [];
                            this._messages[m.conversationId].push(m);
                        }
                    };
                }

                // Conversations helper
                if (!DB.getConversations) {
                    DB.getConversations = function() {
                        const users = this.getUsers();
                        const convs = [];
                        for (const key in this._messages) {
                            const msgs = this._messages[key];
                            if (msgs.length === 0) continue;
                            const user = users.find(u => u.id === key);
                            const lastMsg = msgs[msgs.length - 1];
                            const unread = msgs.filter(m => m.sender === 'user' && !m.read).length;
                            convs.push({
                                userId: key,
                                userName: user ? user.name : 'Unknown User',
                                userEmail: user ? user.email : 'unknown@example.com',
                                lastMsg: lastMsg.text || '📎 File attached',
                                lastTime: lastMsg.timestamp,
                                unread: unread
                            });
                        }
                        // Mark all as read when viewing
                        return convs.sort((a, b) => new Date(b.lastTime) - new Date(a.lastTime));
                    };
                }
                if (!DB.markConversationRead) {
                    DB.markConversationRead = function(userId) {
                        if (this._messages[userId]) {
                            this._messages[userId].forEach(m => { if (m.sender === 'user') m.read = true; });
                        }
                    };
                }
                if (!DB.getUnreadCount) {
                    DB.getUnreadCount = function() {
                        let count = 0;
                        for (const key in this._messages) {
                            count += this._messages[key].filter(m => m.sender === 'user' && !m.read).length;
                        }
                        return count;
                    };
                }

                // Seed demo data if empty
                this.seedDemoData();
            }

            seedDemoData() {
                const users = DB.getUsers();
                if (users.length < 2) {
                    // Add a demo user if none exist
                    if (!users.find(u => u.email === 'demo@example.com')) {
                        users.push({
                            id: 'demo_user_1',
                            name: 'Demo User',
                            email: 'demo@example.com',
                            password: 'demo123',
                            role: 'user',
                            joinDate: new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString()
                        });
                        DB.setUsers(users);
                    }
                }

                // Seed licenses if empty
                let licenses = DB.getLicenses();
                if (licenses.length === 0) {
                    const orders = DB.getOrders();
                    const completed = orders.filter(o => o.status === 'completed');
                    for (const o of completed) {
                        const key = 'TRX-' + Math.random().toString(36).substring(2, 10).toUpperCase() +
                            '-' + Math.random().toString(36).substring(2, 10).toUpperCase();
                        licenses.push({
                            id: 'lic_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                            userId: o.userId,
                            productId: o.productId,
                            key: key,
                            status: 'active',
                            expiryDate: new Date(Date.now() + 365 * 24 * 60 * 60 * 1000).toISOString(),
                            maxActivations: 2,
                            usedActivations: 1,
                            createdAt: new Date().toISOString()
                        });
                    }
                    DB.setLicenses(licenses);
                }

                // Seed payments if empty
                let payments = DB.getPayments();
                if (payments.length === 0) {
                    const orders = DB.getOrders().filter(o => o.status === 'completed');
                    for (const o of orders) {
                        payments.push({
                            id: 'pay_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                            userId: o.userId,
                            orderId: o.id,
                            amount: o.amount || 299,
                            method: ['Credit Card', 'PayPal', 'Bank Transfer'][Math.floor(Math.random() * 3)],
                            last4: '4242',
                            status: 'completed',
                            date: o.date || new Date().toISOString(),
                            receiptUrl: '#'
                        });
                    }
                    DB.setPayments(payments);
                }

                // Seed support tickets if empty
                let tickets = DB.getTickets();
                if (tickets.length === 0) {
                    const usersList = DB.getUsers();
                    const demoUser = usersList.find(u => u.role === 'user') || usersList[0];
                    if (demoUser) {
                        tickets.push({
                            id: 'tkt_' + Date.now().toString(36),
                            userId: demoUser.id,
                            subject: 'License activation issue',
                            status: 'open',
                            priority: 'high',
                            createdAt: new Date(Date.now() - 2 * 24 * 60 * 60 * 1000).toISOString(),
                            updatedAt: new Date(Date.now() - 1 * 24 * 60 * 60 * 1000).toISOString()
                        });
                        tickets.push({
                            id: 'tkt_' + Date.now().toString(36) + '2',
                            userId: demoUser.id,
                            subject: 'Question about trailing stop feature',
                            status: 'resolved',
                            priority: 'medium',
                            createdAt: new Date(Date.now() - 5 * 24 * 60 * 60 * 1000).toISOString(),
                            updatedAt: new Date(Date.now() - 3 * 24 * 60 * 60 * 1000).toISOString()
                        });
                        DB.setTickets(tickets);
                    }
                }
            }

            // ============================================================
            //  INIT
            // ============================================================
            init() {
                this.setupAuth();
                this.attachEventListeners();
                this.updateNav();
                this.renderDashboard();
            }

            setupAuth() {
                this.currentUser = getCurrentUser();
                if (!this.currentUser) {
                    window.location.href = 'login.html';
                    return;
                }
                if (this.currentUser.role !== 'admin') {
                    window.location.href = 'user-dashboard.html';
                    return;
                }
            }

            attachEventListeners() {
                document.addEventListener('keydown', (e) => this.handleKeyPress(e));
                document.addEventListener('visibilitychange', () => this.handleVisibilityChange());
                document.addEventListener('change', (e) => this.handleFileChange(e));
                document.getElementById('imageModal').addEventListener('click', (e) => {
                    if (e.target === document.getElementById('imageModal')) this.closeImageModal();
                });
            }

            updateNav() {
                if (this.currentUser) {
                    document.getElementById('userAvatar').textContent = this.currentUser.name.charAt(0).toUpperCase();
                    document.getElementById('userName').textContent = this.sanitize(this.currentUser.name);
                }
            }

            // ========== RENDERING ==========
            renderDashboard() {
                this.renderSidebar();
                this.renderContent();
            }

            renderSidebar() {
                const sidebar = document.getElementById('dashSidebar');
                const unread = DB.getUnreadCount();
                const tickets = DB.getTickets();
                const openTickets = tickets.filter(t => t.status === 'open').length;

                const items = [
                    { id: 'overview', icon: '📊', label: 'Dashboard' },
                    { id: 'users', icon: '👥', label: 'Users' },
                    { id: 'products', icon: '📦', label: 'Products' },
                    { id: 'orders', icon: '📋', label: 'Orders' },
                    { id: 'licenses', icon: '🔑', label: 'Licenses' },
                    { id: 'payments', icon: '💳', label: 'Payments' },
                    { id: 'support', icon: '💬', label: 'Support', badge: openTickets > 0 ? openTickets : null },
                ];

                sidebar.innerHTML = items.map(item =>
                    `<div class="menu-item ${this.currentTab === item.id ? 'active' : ''}" onclick="adminApp.switchTab('${item.id}')" role="button" tabindex="0" aria-label="${item.label}">
                        <span class="icon" aria-hidden="true">${item.icon}</span> ${item.label}
                        ${item.badge ? `<span class="badge-indicator">${item.badge}</span>` : ''}
                    </div>`
                ).join('');
            }

            switchTab(tab) {
                this.currentTab = tab;
                this.selectedTicketId = null;
                this.pendingAttachments = [];
                this.renderDashboard();
            }

            renderContent() {
                const container = document.getElementById('dashContent');
                let html = '';
                try {
                    switch (this.currentTab) {
                        case 'overview':
                            html = this.renderOverview();
                            break;
                        case 'users':
                            html = this.renderUsers();
                            break;
                        case 'products':
                            html = this.renderProducts();
                            break;
                        case 'orders':
                            html = this.renderOrders();
                            break;
                        case 'licenses':
                            html = this.renderLicenses();
                            break;
                        case 'payments':
                            html = this.renderPayments();
                            break;
                        case 'support':
                            html = this.renderSupport();
                            break;
                        default:
                            html = '<p>Page not found.</p>';
                    }
                    container.innerHTML = html;
                } catch (error) {
                    console.error('Error rendering content:', error);
                    container.innerHTML = this.renderEmptyState('⚠️', 'Error', 'Failed to load this section.');
                }
            }

            // ============================================================
            //  1. DASHBOARD (OVERVIEW)
            // ============================================================
            renderOverview() {
                const users = DB.getUsers();
                const orders = DB.getOrders();
                const products = DB.getProducts();
                const licenses = DB.getLicenses();
                const payments = DB.getPayments();
                const completed = orders.filter(o => o.status === 'completed');
                const revenue = completed.reduce((s, o) => s + (o.amount || 0), 0);
                const tickets = DB.getTickets();
                const openTickets = tickets.filter(t => t.status === 'open').length;

                return `
                    <div class="dash-header">
                        <div>
                            <h1>📊 Admin Dashboard</h1>
                            <span class="sub">Manage your platform</span>
                        </div>
                        <button class="btn-primary small" onclick="adminApp.renderDashboard()">🔄 Refresh</button>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-card gold-border"><div class="num">${users.length}</div><div class="label">Total Users</div></div>
                        <div class="stat-card blue-border"><div class="num">${orders.length}</div><div class="label">Total Orders</div></div>
                        <div class="stat-card green-border"><div class="num">$${revenue}</div><div class="label">Revenue</div></div>
                        <div class="stat-card purple-border"><div class="num">${licenses.length}</div><div class="label">Active Licenses</div></div>
                        <div class="stat-card red-border"><div class="num">${openTickets}</div><div class="label">Open Tickets</div></div>
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:16px;">
                        <div style="background:#141a24;border:1px solid #1f2937;border-radius:16px;padding:20px;">
                            <h3 style="font-size:16px;margin-bottom:8px;">Recent Orders</h3>
                            ${orders.length === 0 ? '<p class="text-muted fs-14">No orders yet.</p>' :
                                `<div style="margin-top:8px;">${orders.slice(-5).reverse().map(o => {
                                    const u = users.find(x => x.id === o.userId);
                                    const p = products.find(x => x.id === o.productId);
                                    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #1f2937;font-size:14px;">
                                        <span>${this.sanitize(u ? u.name : 'Unknown')} → ${this.sanitize(p ? p.name : 'Product')}</span>
                                        <span class="badge ${o.status === 'completed' ? 'green' : 'yellow'}">${o.status}</span>
                                    </div>`;
                                }).join('')}</div>`
                            }
                        </div>
                        <div style="background:#141a24;border:1px solid #1f2937;border-radius:16px;padding:20px;">
                            <h3 style="font-size:16px;margin-bottom:8px;">Quick Actions</h3>
                            <div style="display:flex;flex-direction:column;gap:10px;margin-top:10px;">
                                <button class="btn-primary small" onclick="adminApp.switchTab('users')">👥 Manage Users</button>
                                <button class="btn-primary small" onclick="adminApp.switchTab('products')">📦 Manage Products</button>
                                <button class="btn-primary small" onclick="adminApp.switchTab('orders')">📋 View Orders</button>
                                <button class="btn-primary small" onclick="adminApp.switchTab('licenses')">🔑 Licenses</button>
                                <button class="btn-primary small" onclick="adminApp.switchTab('support')">💬 Support ${openTickets > 0 ? `(${openTickets})` : ''}</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            // ============================================================
            //  2. USERS
            // ============================================================
            renderUsers() {
                const users = DB.getUsers();
                if (users.length === 0) {
                    return this.renderEmptyState('👥', 'No users', 'Users will appear here when they register.');
                }

                return `
                    <div class="dash-header">
                        <h1>👥 Users (${users.length})</h1>
                        <button class="btn-primary small" onclick="adminApp.showAddUserDialog()">+ Add User</button>
                    </div>
                    <div class="table-wrap">
                        <table>
                            <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th>Actions</th></tr></thead>
                            <tbody>${users.map(u => `
                                <tr>
                                    <td>${this.sanitize(u.name)}</td>
                                    <td>${this.sanitize(u.email)}</td>
                                    <td><span class="badge ${u.role === 'admin' ? 'yellow' : 'blue'}">${u.role}</span></td>
                                    <td>${this.formatDate(u.joinDate)}</td>
                                    <td>
                                        <button class="btn-outline" style="padding:4px 12px;font-size:12px;" onclick="adminApp.toggleUserRole('${u.id}')" title="Toggle role">${u.role === 'admin' ? '→ User' : '→ Admin'}</button>
                                        ${u.id !== this.currentUser.id ? `<button class="btn-danger" style="padding:4px 12px;font-size:12px;margin-left:6px;" onclick="adminApp.deleteUser('${u.id}')" title="Delete user">✕</button>` : ''}
                                    </td>
                                </tr>
                            `).join('')}</tbody>
                        </table>
                    </div>
                `;
            }

            showAddUserDialog() {
                this.openModal('Add User', `
                    <form onsubmit="adminApp.handleAddUser(event)">
                        <div class="form-group"><label>Name</label><input type="text" id="addUserName" required placeholder="Full name" /></div>
                        <div class="form-group"><label>Email</label><input type="email" id="addUserEmail" required placeholder="Email" /></div>
                        <div class="form-group"><label>Password</label><input type="password" id="addUserPass" required placeholder="Min 6 chars" minlength="6" /></div>
                        <div class="form-group"><label>Role</label>
                            <select id="addUserRole"><option value="user">User</option><option value="admin">Admin</option></select>
                        </div>
                        <button type="submit" class="btn-primary" style="width:100%;">Add User</button>
                    </form>
                `);
            }

            handleAddUser(e) {
                e.preventDefault();
                const name = document.getElementById('addUserName').value.trim();
                const email = document.getElementById('addUserEmail').value.trim();
                const pass = document.getElementById('addUserPass').value.trim();
                const role = document.getElementById('addUserRole').value;

                const users = DB.getUsers();
                if (users.find(u => u.email === email)) {
                    this.showToast('Email already exists.', 'error');
                    return;
                }

                users.push({
                    id: uid(),
                    name: name,
                    email: email,
                    password: pass,
                    role: role,
                    joinDate: new Date().toISOString()
                });
                DB.setUsers(users);
                this.closeModal();
                this.showToast('User added successfully.', 'success');
                this.renderDashboard();
            }

            toggleUserRole(id) {
                const users = DB.getUsers();
                const u = users.find(x => x.id === id);
                if (!u) return;
                if (u.id === this.currentUser.id) {
                    this.showToast('Cannot change your own role.', 'error');
                    return;
                }
                u.role = u.role === 'admin' ? 'user' : 'admin';
                DB.setUsers(users);
                this.showToast(`User ${this.sanitize(u.name)} is now ${u.role}.`, 'success');
                this.renderDashboard();
            }

            deleteUser(id) {
                if (id === this.currentUser.id) {
                    this.showToast('Cannot delete yourself.', 'error');
                    return;
                }
                if (!confirm('Delete this user? All orders, licenses, payments and messages will be removed.')) return;

                let users = DB.getUsers();
                users = users.filter(u => u.id !== id);
                DB.setUsers(users);

                let orders = DB.getOrders();
                orders = orders.filter(o => o.userId !== id);
                DB.setOrders(orders);

                let licenses = DB.getLicenses();
                licenses = licenses.filter(l => l.userId !== id);
                DB.setLicenses(licenses);

                let payments = DB.getPayments();
                payments = payments.filter(p => p.userId !== id);
                DB.setPayments(payments);

                let tickets = DB.getTickets();
                tickets = tickets.filter(t => t.userId !== id);
                DB.setTickets(tickets);

                // Remove messages
                const msgs = DB.getMessages();
                const filtered = msgs.filter(m => m.conversationId !== id);
                DB.setMessages(filtered);

                this.showToast('User deleted.', 'success');
                this.renderDashboard();
            }

            // ============================================================
            //  3. PRODUCTS
            // ============================================================
            renderProducts() {
                const products = DB.getProducts();
                if (products.length === 0) {
                    return this.renderEmptyState('📦', 'No products', 'Add products to sell.');
                }

                return `
                    <div class="dash-header">
                        <h1>📦 Products (${products.length})</h1>
                        <button class="btn-primary small" onclick="adminApp.showAddProductDialog()">+ Add Product</button>
                    </div>
                    <div class="table-wrap">
                        <table>
                            <thead><tr><th>Name</th><th>Price</th><th>Type</th><th>Features</th><th>Downloads</th><th>Actions</th></tr></thead>
                            <tbody>${products.map(p => `
                                <tr>
                                    <td>${this.sanitize(p.name)}</td>
                                    <td>$${p.price}</td>
                                    <td><span class="badge blue">${p.type || 'standard'}</span></td>
                                    <td style="max-width:150px;word-break:break-word;font-size:12px;">${p.features ? p.features.slice(0, 2).join(', ') : '-'}</td>
                                    <td style="max-width:100px;word-break:break-all;font-size:12px;">${p.downloadLink ? p.downloadLink.substring(0, 20) + '…' : '-'}</td>
                                    <td>
                                        <button class="btn-outline" style="padding:4px 12px;font-size:12px;" onclick="adminApp.showEditProductDialog(${p.id})">✎</button>
                                        <button class="btn-danger" style="padding:4px 12px;font-size:12px;margin-left:6px;" onclick="adminApp.deleteProduct(${p.id})">✕</button>
                                    </td>
                                </tr>
                            `).join('')}</tbody>
                        </table>
                    </div>
                `;
            }

            showAddProductDialog() {
                this.openModal('Add Product', `
                    <form onsubmit="adminApp.handleAddProduct(event)">
                        <div class="form-group"><label>Name</label><input type="text" id="addProdName" required placeholder="Product name" /></div>
                        <div class="form-group"><label>Price ($)</label><input type="number" id="addProdPrice" required placeholder="99" step="0.01" /></div>
                        <div class="form-group"><label>Description</label><textarea id="addProdDesc" placeholder="Product description"></textarea></div>
                        <div class="form-group"><label>Type</label><input type="text" id="addProdType" placeholder="standard / pro / vip" value="standard" /></div>
                        <div class="form-group"><label>Features (comma-separated)</label><input type="text" id="addProdFeatures" placeholder="Feature 1, Feature 2" /></div>
                        <div class="form-group"><label>Download Link</label><input type="text" id="addProdLink" placeholder="https://..." value="#" /></div>
                        <button type="submit" class="btn-primary" style="width:100%;">Add Product</button>
                    </form>
                `);
            }

            handleAddProduct(e) {
                e.preventDefault();
                const name = document.getElementById('addProdName').value.trim();
                const price = parseFloat(document.getElementById('addProdPrice').value);
                const desc = document.getElementById('addProdDesc').value.trim();
                const type = document.getElementById('addProdType').value.trim() || 'standard';
                const featuresStr = document.getElementById('addProdFeatures').value.trim();
                const link = document.getElementById('addProdLink').value.trim() || '#';

                if (!name || isNaN(price)) {
                    this.showToast('Name and price are required.', 'error');
                    return;
                }

                const products = DB.getProducts();
                const id = products.length ? Math.max(...products.map(p => p.id)) + 1 : 1;
                const features = featuresStr ? featuresStr.split(',').map(f => f.trim()) : [];

                products.push({
                    id,
                    name,
                    description: desc,
                    price,
                    type,
                    features,
                    downloadLink: link
                });
                DB.setProducts(products);
                this.closeModal();
                this.showToast('Product added.', 'success');
                this.renderDashboard();
            }

            showEditProductDialog(id) {
                const products = DB.getProducts();
                const p = products.find(x => x.id === id);
                if (!p) return;

                this.openModal('Edit Product', `
                    <form onsubmit="adminApp.handleEditProduct(event, ${id})">
                        <div class="form-group"><label>Name</label><input type="text" id="editProdName" value="${this.sanitize(p.name)}" required /></div>
                        <div class="form-group"><label>Price ($)</label><input type="number" id="editProdPrice" value="${p.price}" required step="0.01" /></div>
                        <div class="form-group"><label>Description</label><textarea id="editProdDesc">${this.sanitize(p.description || '')}</textarea></div>
                        <div class="form-group"><label>Type</label><input type="text" id="editProdType" value="${this.sanitize(p.type || 'standard')}" /></div>
                        <div class="form-group"><label>Features (comma-separated)</label><input type="text" id="editProdFeatures" value="${p.features ? p.features.join(', ') : ''}" /></div>
                        <div class="form-group"><label>Download Link</label><input type="text" id="editProdLink" value="${this.sanitize(p.downloadLink || '#')}" /></div>
                        <button type="submit" class="btn-primary" style="width:100%;">Update Product</button>
                    </form>
                `);
            }

            handleEditProduct(e, id) {
                e.preventDefault();
                const products = DB.getProducts();
                const p = products.find(x => x.id === id);
                if (!p) return;

                p.name = document.getElementById('editProdName').value.trim();
                p.price = parseFloat(document.getElementById('editProdPrice').value);
                p.description = document.getElementById('editProdDesc').value.trim();
                p.type = document.getElementById('editProdType').value.trim() || 'standard';
                const featuresStr = document.getElementById('editProdFeatures').value.trim();
                p.features = featuresStr ? featuresStr.split(',').map(f => f.trim()) : [];
                p.downloadLink = document.getElementById('editProdLink').value.trim() || '#';

                DB.setProducts(products);
                this.closeModal();
                this.showToast('Product updated.', 'success');
                this.renderDashboard();
            }

            deleteProduct(id) {
                if (!confirm('Delete this product?')) return;
                let products = DB.getProducts();
                products = products.filter(p => p.id !== id);
                DB.setProducts(products);
                this.showToast('Product deleted.', 'success');
                this.renderDashboard();
            }

            // ============================================================
            //  4. ORDERS
            // ============================================================
            renderOrders() {
                const orders = DB.getOrders();
                const users = DB.getUsers();
                const products = DB.getProducts();

                if (orders.length === 0) {
                    return this.renderEmptyState('📋', 'No orders', 'Orders will appear here when users make purchases.');
                }

                return `
                    <div class="dash-header">
                        <h1>📋 Orders (${orders.length})</h1>
                        <button class="btn-primary small" onclick="adminApp.renderDashboard()">🔄 Refresh</button>
                    </div>
                    <div class="table-wrap">
                        <table>
                            <thead><tr><th>User</th><th>Product</th><th>Amount</th><th>Date</th><th>Status</th><th>Action</th></tr></thead>
                            <tbody>${orders.map(o => {
                                const u = users.find(x => x.id === o.userId);
                                const p = products.find(x => x.id === o.productId);
                                return `<tr>
                                    <td>${this.sanitize(u ? u.name : 'Unknown')}</td>
                                    <td>${this.sanitize(p ? p.name : 'Unknown')}</td>
                                    <td>$${o.amount || p?.price || 0}</td>
                                    <td>${this.formatDate(o.date)}</td>
                                    <td><span class="badge ${o.status === 'completed' ? 'green' : 'yellow'}">${o.status}</span></td>
                                    <td>
                                        ${o.status === 'pending' ? `<button class="btn-success" style="padding:4px 12px;font-size:12px;" onclick="adminApp.completeOrder('${o.id}')">Complete</button>` : 
                                        o.status === 'completed' ? `<span class="badge green">✓ Done</span>` : '-'}
                                    </td>
                                </tr>`;
                            }).join('')}</tbody>
                        </table>
                    </div>
                `;
            }

            completeOrder(id) {
                const orders = DB.getOrders();
                const o = orders.find(x => x.id === id);
                if (!o) return;
                o.status = 'completed';
                DB.setOrders(orders);

                // Auto-generate license
                const products = DB.getProducts();
                const p = products.find(x => x.id === o.productId);
                if (p) {
                    const licenses = DB.getLicenses();
                    if (!licenses.find(l => l.userId === o.userId && l.productId === o.productId)) {
                        const key = 'TRX-' + Math.random().toString(36).substring(2, 10).toUpperCase() +
                            '-' + Math.random().toString(36).substring(2, 10).toUpperCase();
                        licenses.push({
                            id: 'lic_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                            userId: o.userId,
                            productId: o.productId,
                            key: key,
                            status: 'active',
                            expiryDate: new Date(Date.now() + 365 * 24 * 60 * 60 * 1000).toISOString(),
                            maxActivations: 2,
                            usedActivations: 1,
                            createdAt: new Date().toISOString()
                        });
                        DB.setLicenses(licenses);
                    }
                }

                this.showToast('Order completed & license generated.', 'success');
                this.renderDashboard();
            }

            // ============================================================
            //  5. LICENSES
            // ============================================================
            renderLicenses() {
                const licenses = DB.getLicenses();
                const users = DB.getUsers();
                const products = DB.getProducts();

                if (licenses.length === 0) {
                    return this.renderEmptyState('🔑', 'No licenses', 'Licenses are generated when orders are completed.');
                }

                return `
                    <div class="dash-header">
                        <h1>🔑 Licenses (${licenses.length})</h1>
                        <button class="btn-primary small" onclick="adminApp.showCreateLicenseDialog()">+ Create License</button>
                    </div>
                    <div class="license-grid">${licenses.map(l => {
                        const user = users.find(u => u.id === l.userId);
                        const product = products.find(p => p.id === l.productId);
                        const statusClass = l.status === 'active' ? 'green' : l.status === 'expired' ? 'red' : 'yellow';
                        return `
                            <div class="license-card" style="border-left-color: ${l.status === 'active' ? '#34d399' : l.status === 'expired' ? '#f87171' : '#fbbf24'};">
                                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
                                    <div class="lkey">${this.sanitize(l.key)}</div>
                                    <span class="badge ${statusClass}">${l.status}</span>
                                </div>
                                <div class="linfo">User: <span>${user ? this.sanitize(user.name) : 'Unknown'}</span></div>
                                <div class="linfo">Product: <span>${product ? this.sanitize(product.name) : 'Unknown'}</span></div>
                                <div class="linfo">Expires: <span>${l.expiryDate ? this.formatDate(l.expiryDate) : 'Never'}</span></div>
                                <div class="linfo">Activations: <span>${l.usedActivations || 0} / ${l.maxActivations || 1}</span></div>
                                <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">
                                    <button class="btn-ghost small" onclick="adminApp.copyLicense('${l.key}')">📋 Copy</button>
                                    ${l.status === 'active' ? `<button class="btn-danger small" onclick="adminApp.revokeLicense('${l.id}')">Revoke</button>` : ''}
                                    <button class="btn-outline small" onclick="adminApp.showLicenseDetails('${l.id}')">Details</button>
                                </div>
                            </div>
                        `;
                    }).join('')}</div>
                `;
            }

            showCreateLicenseDialog() {
                const users = DB.getUsers();
                const products = DB.getProducts();

                let userOpts = users.map(u => `<option value="${u.id}">${this.sanitize(u.name)} (${this.sanitize(u.email)})</option>`).join('');
                let prodOpts = products.map(p => `<option value="${p.id}">${this.sanitize(p.name)}</option>`).join('');

                this.openModal('Create License', `
                    <form onsubmit="adminApp.handleCreateLicense(event)">
                        <div class="form-group"><label>User</label>
                            <select id="licUser">${userOpts}</select>
                        </div>
                        <div class="form-group"><label>Product</label>
                            <select id="licProduct">${prodOpts}</select>
                        </div>
                        <div class="form-group"><label>Max Activations</label>
                            <input type="number" id="licMaxAct" value="2" min="1" />
                        </div>
                        <div class="form-group"><label>Expiry (days from now)</label>
                            <input type="number" id="licExpiryDays" value="365" min="1" />
                        </div>
                        <button type="submit" class="btn-primary" style="width:100%;">Create License</button>
                    </form>
                `);
            }

            handleCreateLicense(e) {
                e.preventDefault();
                const userId = document.getElementById('licUser').value;
                const productId = parseInt(document.getElementById('licProduct').value);
                const maxAct = parseInt(document.getElementById('licMaxAct').value) || 2;
                const days = parseInt(document.getElementById('licExpiryDays').value) || 365;

                const key = 'TRX-' + Math.random().toString(36).substring(2, 10).toUpperCase() +
                    '-' + Math.random().toString(36).substring(2, 10).toUpperCase();

                const licenses = DB.getLicenses();
                licenses.push({
                    id: 'lic_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                    userId: userId,
                    productId: productId,
                    key: key,
                    status: 'active',
                    expiryDate: new Date(Date.now() + days * 24 * 60 * 60 * 1000).toISOString(),
                    maxActivations: maxAct,
                    usedActivations: 0,
                    createdAt: new Date().toISOString()
                });
                DB.setLicenses(licenses);
                this.closeModal();
                this.showToast(`License created: ${key}`, 'success');
                this.renderDashboard();
            }

            revokeLicense(id) {
                if (!confirm('Revoke this license?')) return;
                const licenses = DB.getLicenses();
                const l = licenses.find(x => x.id === id);
                if (l) {
                    l.status = 'revoked';
                    DB.setLicenses(licenses);
                    this.showToast('License revoked.', 'success');
                    this.renderDashboard();
                }
            }

            copyLicense(key) {
                navigator.clipboard?.writeText(key).then(() => {
                    this.showToast('License key copied!', 'success');
                }).catch(() => {
                    // Fallback
                    const ta = document.createElement('textarea');
                    ta.value = key;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    ta.remove();
                    this.showToast('License key copied!', 'success');
                });
            }

            showLicenseDetails(id) {
                const licenses = DB.getLicenses();
                const l = licenses.find(x => x.id === id);
                if (!l) return;
                const users = DB.getUsers();
                const products = DB.getProducts();
                const user = users.find(u => u.id === l.userId);
                const product = products.find(p => p.id === l.productId);

                this.openModal('License Details', `
                    <div style="font-size:14px;line-height:2;">
                        <p><strong>Key:</strong> <code style="background:#1f2937;padding:2px 10px;border-radius:4px;color:#fbbf24;">${this.sanitize(l.key)}</code></p>
                        <p><strong>User:</strong> ${user ? this.sanitize(user.name) : 'Unknown'}</p>
                        <p><strong>Product:</strong> ${product ? this.sanitize(product.name) : 'Unknown'}</p>
                        <p><strong>Status:</strong> <span class="badge ${l.status === 'active' ? 'green' : l.status === 'expired' ? 'red' : 'yellow'}">${l.status}</span></p>
                        <p><strong>Expires:</strong> ${l.expiryDate ? this.formatDate(l.expiryDate) : 'Never'}</p>
                        <p><strong>Activations:</strong> ${l.usedActivations || 0} / ${l.maxActivations || 1}</p>
                        <p><strong>Created:</strong> ${this.formatDate(l.createdAt)}</p>
                    </div>
                `);
            }

            // ============================================================
            //  6. PAYMENTS
            // ============================================================
            renderPayments() {
                const payments = DB.getPayments();
                const users = DB.getUsers();

                if (payments.length === 0) {
                    return this.renderEmptyState('💳', 'No payments', 'Payment history will appear here.');
                }

                return `
                    <div class="dash-header">
                        <h1>💳 Payments (${payments.length})</h1>
                        <button class="btn-primary small" onclick="adminApp.renderDashboard()">🔄 Refresh</button>
                    </div>
                    <div class="payment-grid">${payments.map(p => {
                        const user = users.find(u => u.id === p.userId);
                        const statusClass = p.status === 'completed' ? 'green' : p.status === 'pending' ? 'yellow' : 'red';
                        return `
                            <div class="payment-card">
                                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
                                    <div class="pamount">$${p.amount}</div>
                                    <span class="badge ${statusClass}">${p.status}</span>
                                </div>
                                <div style="font-size:14px;color:#9ca3af;margin:4px 0;">${user ? this.sanitize(user.name) : 'Unknown'}</div>
                                <div class="pmethod" style="font-size:13px;color:#9ca3af;">${p.method || 'Credit Card'} ${p.last4 ? `•••• ${p.last4}` : ''}</div>
                                <div class="pdate" style="font-size:12px;color:#6b7280;">${this.formatDate(p.date)}</div>
                                <div style="font-size:12px;color:#6b7280;margin-top:4px;">Order: #${p.orderId?.slice(0,6).toUpperCase() || 'N/A'}</div>
                                <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
                                    ${p.receiptUrl ? `<button class="btn-ghost small" onclick="adminApp.showToast('Receipt downloaded!', 'success')">📄 Receipt</button>` : ''}
                                    ${p.status === 'completed' ? `<button class="btn-danger small" onclick="adminApp.refundPayment('${p.id}')">↩ Refund</button>` : ''}
                                </div>
                            </div>
                        `;
                    }).join('')}</div>
                `;
            }

            refundPayment(id) {
                if (!confirm('Refund this payment?')) return;
                const payments = DB.getPayments();
                const p = payments.find(x => x.id === id);
                if (p) {
                    p.status = 'refunded';
                    DB.setPayments(payments);
                    this.showToast(`Payment of $${p.amount} refunded.`, 'success');
                    this.renderDashboard();
                }
            }

            // ============================================================
