                e.preventDefault();
                const eas = DB.getEAs();
                const ea = eas.find(x => x.id === id);
                if (!ea) return;
                const data = this.collectEAData();
                if (!data.name || !data.shortDesc) { this.toast('Name and short description required.', 'error'); return; }
                Object.assign(ea, data);
                DB.setEAs(eas);
                this.closeModal();
                this.toast('EA updated.', 'success');
                this.renderDashboard();
            }

            deleteEA(id) {
                if (!confirm('Delete this EA?')) return;
                DB.setEAs(DB.getEAs().filter(x => x.id !== id));
                this.toast('EA deleted.', 'success');
                this.renderDashboard();
            }

            // ===== SETTINGS =====
            renderSettings() {
                const settings = DB.get('settings') || {};
                const site = settings.site || {};
                const hero = settings.hero || {};
                const features = DB.get('features') || [];
                const faqs = DB.getFaq();
                const blogs = DB.getBlog();
                const reviews = DB.getReviews();
                return `
                    <div class="dash-header"><h1>⚙️ Settings</h1></div>
                    <div class="settings-grid">
                        <div class="settings-card">
                            <h3>🏢 Site Settings</h3>
                            <form onsubmit="adminApp.saveSiteSettings(event)">
                                <div class="form-group"><label>Site Name</label><input type="text" id="sName" value="${this.sanitize(site.name || 'RhinoFX')}" /></div>
                                <div class="form-group"><label>Tagline</label><input type="text" id="sTagline" value="${this.sanitize(site.tagline || '')}" /></div>
                                <div class="form-group"><label>Email</label><input type="email" id="sEmail" value="${this.sanitize(site.email || '')}" /></div>
                                <div class="form-group"><label>Phone</label><input type="text" id="sPhone" value="${this.sanitize(site.phone || '')}" /></div>
                                <button type="submit" class="btn btn-primary btn-sm">Save</button>
                            </form>
                        </div>
                        <div class="settings-card">
                            <h3>🎯 Hero Section</h3>
                            <form onsubmit="adminApp.saveHeroSettings(event)">
                                <div class="form-group"><label>Badge</label><input type="text" id="hBadge" value="${this.sanitize(hero.badge || '')}" /></div>
                                <div class="form-group"><label>Title</label><input type="text" id="hTitle" value="${this.sanitize(hero.title || '')}" /></div>
                                <div class="form-group"><label>Description</label><textarea id="hDesc" rows="2">${this.sanitize(hero.desc || '')}</textarea></div>
                                <div class="form-group"><label>CTA</label><input type="text" id="hCta" value="${this.sanitize(hero.cta || '')}" /></div>
                                <button type="submit" class="btn btn-primary btn-sm">Save</button>
                            </form>
                        </div>
                    </div>
                    <div class="settings-card mt-16"><h3>✨ Features <button class="btn btn-primary btn-sm" onclick="adminApp.showAddFeature()">+</button></h3>
                        ${features.map(f => `<div class="settings-item"><div class="item-text"><span>${f.icon}</span> <strong>${this.sanitize(f.title)}</strong> <small>${this.sanitize(f.desc)}</small></div>
                            <div class="actions"><button class="btn btn-secondary btn-xs" onclick="adminApp.showEditFeature(${f.id})">Edit</button><button class="btn btn-danger btn-xs" onclick="adminApp.deleteFeature(${f.id})">✕</button></div></div>`).join('') || '<p class="text-muted">No features.</p>'}
                    </div>
                    <div class="settings-card mt-16"><h3>❓ FAQs <button class="btn btn-primary btn-sm" onclick="adminApp.showAddFaq()">+</button></h3>
                        ${faqs.map((f,i) => `<div class="settings-item"><div class="item-text"><strong>${this.sanitize(f.q)}</strong> <small>${this.sanitize(f.a)}</small></div>
                            <div class="actions"><button class="btn btn-secondary btn-xs" onclick="adminApp.showEditFaq(${i})">Edit</button><button class="btn btn-danger btn-xs" onclick="adminApp.deleteFaq(${i})">✕</button></div></div>`).join('') || '<p class="text-muted">No FAQs.</p>'}
                    </div>
                    <div class="settings-card mt-16"><h3>📝 Blog <button class="btn btn-primary btn-sm" onclick="adminApp.showAddBlog()">+</button></h3>
                        ${blogs.map((b,i) => `<div class="settings-item"><div class="item-text"><strong>${this.sanitize(b.title)}</strong> <small>${this.sanitize(b.excerpt)}</small></div>
                            <div class="actions"><button class="btn btn-secondary btn-xs" onclick="adminApp.showEditBlog(${i})">Edit</button><button class="btn btn-danger btn-xs" onclick="adminApp.deleteBlog(${i})">✕</button></div></div>`).join('') || '<p class="text-muted">No posts.</p>'}
                    </div>
                    <div class="settings-card mt-16"><h3>⭐ Reviews <button class="btn btn-primary btn-sm" onclick="adminApp.showAddReview()">+</button></h3>
                        ${reviews.map((r,i) => `<div class="settings-item"><div class="item-text"><strong>${this.sanitize(r.name)}</strong> (${r.rating}⭐) <small>${this.sanitize(r.text)}</small></div>
                            <div class="actions"><button class="btn btn-secondary btn-xs" onclick="adminApp.showEditReview(${i})">Edit</button><button class="btn btn-danger btn-xs" onclick="adminApp.deleteReview(${i})">✕</button></div></div>`).join('') || '<p class="text-muted">No reviews.</p>'}
                    </div>
                `;
            }

            saveSiteSettings(e) {
                e.preventDefault();
                const settings = DB.get('settings') || {};
                settings.site = {
                    name: document.getElementById('sName').value.trim(),
                    tagline: document.getElementById('sTagline').value.trim(),
                    email: document.getElementById('sEmail').value.trim(),
                    phone: document.getElementById('sPhone').value.trim()
                };
                DB.set('settings', settings);
                this.toast('Site settings saved.', 'success');
                this.renderDashboard();
            }

            saveHeroSettings(e) {
                e.preventDefault();
                const settings = DB.get('settings') || {};
                settings.hero = {
                    badge: document.getElementById('hBadge').value.trim(),
                    title: document.getElementById('hTitle').value.trim(),
                    desc: document.getElementById('hDesc').value.trim(),
                    cta: document.getElementById('hCta').value.trim()
                };
                DB.set('settings', settings);
                this.toast('Hero settings saved.', 'success');
                this.renderDashboard();
            }

            showAddFeature() {
                this.openModal('Add Feature', `
                    <form onsubmit="adminApp.handleAddFeature(event)">
                        <div class="form-group"><label>Icon</label><input type="text" id="fIcon" placeholder="📊" required /></div>
                        <div class="form-group"><label>Title</label><input type="text" id="fTitle" required /></div>
                        <div class="form-group"><label>Description</label><textarea id="fDesc" required></textarea></div>
                        <button type="submit" class="btn btn-primary w-full">Add</button>
                    </form>
                `);
            }

            handleAddFeature(e) {
                e.preventDefault();
                const features = DB.get('features') || [];
                const id = features.length ? Math.max(...features.map(f => f.id)) + 1 : 1;
                features.push({ id, icon: document.getElementById('fIcon').value.trim() || '📌',
                    title: document.getElementById('fTitle').value.trim(),
                    desc: document.getElementById('fDesc').value.trim() });
                DB.set('features', features);
                this.closeModal();
                this.toast('Feature added.', 'success');
                this.renderDashboard();
            }

            showEditFeature(id) {
                const features = DB.get('features') || [];
                const f = features.find(x => x.id === id);
                if (!f) return;
                this.openModal('Edit Feature', `
                    <form onsubmit="adminApp.handleEditFeature(event, ${id})">
                        <div class="form-group"><label>Icon</label><input type="text" id="fIconEdit" value="${this.sanitize(f.icon)}" required /></div>
                        <div class="form-group"><label>Title</label><input type="text" id="fTitleEdit" value="${this.sanitize(f.title)}" required /></div>
                        <div class="form-group"><label>Description</label><textarea id="fDescEdit">${this.sanitize(f.desc)}</textarea></div>
                        <button type="submit" class="btn btn-primary w-full">Update</button>
                    </form>
                `);
            }

            handleEditFeature(e, id) {
                e.preventDefault();
                const features = DB.get('features') || [];
                const f = features.find(x => x.id === id);
                if (!f) return;
                f.icon = document.getElementById('fIconEdit').value.trim() || '📌';
                f.title = document.getElementById('fTitleEdit').value.trim();
                f.desc = document.getElementById('fDescEdit').value.trim();
                DB.set('features', features);
                this.closeModal();
                this.toast('Feature updated.', 'success');
                this.renderDashboard();
            }

            deleteFeature(id) {
                if (!confirm('Delete this feature?')) return;
                DB.set('features', (DB.get('features') || []).filter(f => f.id !== id));
                this.toast('Feature deleted.', 'success');
                this.renderDashboard();
            }

            showAddFaq() {
                this.openModal('Add FAQ', `
                    <form onsubmit="adminApp.handleAddFaq(event)">
                        <div class="form-group"><label>Question</label><input type="text" id="faqQ" required /></div>
                        <div class="form-group"><label>Answer</label><textarea id="faqA" required></textarea></div>
                        <button type="submit" class="btn btn-primary w-full">Add</button>
                    </form>
                `);
            }

            handleAddFaq(e) {
                e.preventDefault();
                const faqs = DB.getFaq();
                faqs.push({ q: document.getElementById('faqQ').value.trim(), a: document.getElementById('faqA').value.trim() });
                DB.setFaq(faqs);
                this.closeModal();
                this.toast('FAQ added.', 'success');
                this.renderDashboard();
            }

            showEditFaq(i) {
                const faqs = DB.getFaq();
                const f = faqs[i];
                if (!f) return;
                this.openModal('Edit FAQ', `
                    <form onsubmit="adminApp.handleEditFaq(event, ${i})">
                        <div class="form-group"><label>Question</label><input type="text" id="faqQEdit" value="${this.sanitize(f.q)}" required /></div>
                        <div class="form-group"><label>Answer</label><textarea id="faqAEdit">${this.sanitize(f.a)}</textarea></div>
                        <button type="submit" class="btn btn-primary w-full">Update</button>
                    </form>
                `);
            }

            handleEditFaq(e, i) {
                e.preventDefault();
                const faqs = DB.getFaq();
                if (!faqs[i]) return;
                faqs[i].q = document.getElementById('faqQEdit').value.trim();
                faqs[i].a = document.getElementById('faqAEdit').value.trim();
                DB.setFaq(faqs);
                this.closeModal();
                this.toast('FAQ updated.', 'success');
                this.renderDashboard();
            }

            deleteFaq(i) {
                if (!confirm('Delete this FAQ?')) return;
                const faqs = DB.getFaq();
                faqs.splice(i, 1);
                DB.setFaq(faqs);
                this.toast('FAQ deleted.', 'success');
                this.renderDashboard();
            }

            showAddBlog() {
                this.openModal('Add Blog', `
                    <form onsubmit="adminApp.handleAddBlog(event)">
                        <div class="form-group"><label>Title</label><input type="text" id="bTitle" required /></div>
                        <div class="form-group"><label>Excerpt</label><textarea id="bExcerpt" required></textarea></div>
                        <div class="form-group"><label>Tag</label><input type="text" id="bTag" placeholder="Education" /></div>
                        <div class="form-group"><label>Date</label><input type="text" id="bDate" placeholder="Jan 15, 2026" /></div>
                        <div class="form-group"><label>Icon</label><input type="text" id="bIcon" placeholder="📈" /></div>
                        <button type="submit" class="btn btn-primary w-full">Add</button>
                    </form>
                `);
            }

            handleAddBlog(e) {
                e.preventDefault();
                const blogs = DB.getBlog();
                blogs.push({
                    id: Date.now(),
                    title: document.getElementById('bTitle').value.trim(),
                    excerpt: document.getElementById('bExcerpt').value.trim(),
                    tag: document.getElementById('bTag').value.trim() || 'Article',
                    date: document.getElementById('bDate').value.trim() || new Date().toLocaleDateString('en-US', { month: 'short',
                        day: 'numeric', year: 'numeric' }),
                    icon: document.getElementById('bIcon').value.trim() || '📚'
                });
                DB.setBlog(blogs);
                this.closeModal();
                this.toast('Blog added.', 'success');
                this.renderDashboard();
            }

            showEditBlog(i) {
                const blogs = DB.getBlog();
                const b = blogs[i];
                if (!b) return;
                this.openModal('Edit Blog', `
                    <form onsubmit="adminApp.handleEditBlog(event, ${i})">
                        <div class="form-group"><label>Title</label><input type="text" id="bTitleEdit" value="${this.sanitize(b.title)}" required /></div>
                        <div class="form-group"><label>Excerpt</label><textarea id="bExcerptEdit">${this.sanitize(b.excerpt)}</textarea></div>
                        <div class="form-group"><label>Tag</label><input type="text" id="bTagEdit" value="${this.sanitize(b.tag)}" /></div>
                        <div class="form-group"><label>Date</label><input type="text" id="bDateEdit" value="${this.sanitize(b.date)}" /></div>
                        <div class="form-group"><label>Icon</label><input type="text" id="bIconEdit" value="${this.sanitize(b.icon)}" /></div>
                        <button type="submit" class="btn btn-primary w-full">Update</button>
                    </form>
                `);
            }

            handleEditBlog(e, i) {
                e.preventDefault();
                const blogs = DB.getBlog();
                if (!blogs[i]) return;
                blogs[i].title = document.getElementById('bTitleEdit').value.trim();
                blogs[i].excerpt = document.getElementById('bExcerptEdit').value.trim();
                blogs[i].tag = document.getElementById('bTagEdit').value.trim() || 'Article';
                blogs[i].date = document.getElementById('bDateEdit').value.trim() || new Date().toLocaleDateString('en-US', { month: 'short',
                    day: 'numeric', year: 'numeric' });
                blogs[i].icon = document.getElementById('bIconEdit').value.trim() || '📚';
                DB.setBlog(blogs);
                this.closeModal();
                this.toast('Blog updated.', 'success');
                this.renderDashboard();
            }

            deleteBlog(i) {
                if (!confirm('Delete this blog?')) return;
                const blogs = DB.getBlog();
                blogs.splice(i, 1);
                DB.setBlog(blogs);
                this.toast('Blog deleted.', 'success');
                this.renderDashboard();
            }

            showAddReview() {
                this.openModal('Add Review', `
                    <form onsubmit="adminApp.handleAddReview(event)">
                        <div class="form-group"><label>Name</label><input type="text" id="rName" required /></div>
                        <div class="form-group"><label>Rating (1-5)</label><input type="number" id="rRating" min="1" max="5" value="5" /></div>
                        <div class="form-group"><label>Text</label><textarea id="rText" required></textarea></div>
                        <div class="form-group"><label>Date</label><input type="text" id="rDate" placeholder="Dec 2025" /></div>
                        <button type="submit" class="btn btn-primary w-full">Add</button>
                    </form>
                `);
            }

            handleAddReview(e) {
                e.preventDefault();
                const reviews = DB.getReviews();
                reviews.push({
                    id: Date.now(),
                    name: document.getElementById('rName').value.trim(),
                    rating: parseInt(document.getElementById('rRating').value) || 5,
                    text: document.getElementById('rText').value.trim(),
                    date: document.getElementById('rDate').value.trim() || new Date().toLocaleDateString('en-US', { month: 'short',
                        year: 'numeric' })
                });
                DB.setReviews(reviews);
                this.closeModal();
                this.toast('Review added.', 'success');
                this.renderDashboard();
            }

            showEditReview(i) {
                const reviews = DB.getReviews();
                const r = reviews[i];
                if (!r) return;
                this.openModal('Edit Review', `
                    <form onsubmit="adminApp.handleEditReview(event, ${i})">
                        <div class="form-group"><label>Name</label><input type="text" id="rNameEdit" value="${this.sanitize(r.name)}" required /></div>
                        <div class="form-group"><label>Rating</label><input type="number" id="rRatingEdit" min="1" max="5" value="${r.rating}" /></div>
                        <div class="form-group"><label>Text</label><textarea id="rTextEdit">${this.sanitize(r.text)}</textarea></div>
                        <div class="form-group"><label>Date</label><input type="text" id="rDateEdit" value="${this.sanitize(r.date)}" /></div>
                        <button type="submit" class="btn btn-primary w-full">Update</button>
                    </form>
                `);
            }

            handleEditReview(e, i) {
                e.preventDefault();
                const reviews = DB.getReviews();
                if (!reviews[i]) return;
                reviews[i].name = document.getElementById('rNameEdit').value.trim();
                reviews[i].rating = parseInt(document.getElementById('rRatingEdit').value) || 5;
                reviews[i].text = document.getElementById('rTextEdit').value.trim();
                reviews[i].date = document.getElementById('rDateEdit').value.trim() || new Date().toLocaleDateString('en-US', { month: 'short',
                    year: 'numeric' });
                DB.setReviews(reviews);
                this.closeModal();
                this.toast('Review updated.', 'success');
                this.renderDashboard();
            }

            deleteReview(i) {
                if (!confirm('Delete this review?')) return;
                const reviews = DB.getReviews();
                reviews.splice(i, 1);
                DB.setReviews(reviews);
                this.toast('Review deleted.', 'success');
                this.renderDashboard();
            }

            // ===== UTILITIES =====
            emptyState(icon, label) {
                return `<div class="empty-state"><div class="icon">${icon}</div><h3>${label}</h3><p>Nothing to show yet.</p></div>`;
            }

            formatDate(ts) {
                if (!ts) return 'N/A';
                const d = new Date(ts);
                if (isNaN(d.getTime())) return 'N/A';
                return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit',
                    minute: '2-digit' });
            }

            sanitize(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            openModal(title, html) {
                document.getElementById('modalTitle').textContent = title;
                document.getElementById('modalBody').innerHTML = html;
                document.getElementById('genericModal').classList.add('open');
            }

            closeModal() {
                document.getElementById('genericModal').classList.remove('open');
            }

            toast(msg, type = 'info') {
                const existing = document.querySelector('.toast');
                if (existing) existing.remove();
                const t = document.createElement('div');
                t.className = `toast ${type}`;
                t.innerHTML =
                    `<span class="toast-icon">${type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️'}</span><span>${this.sanitize(msg)}</span>`;
                document.body.appendChild(t);
                setTimeout(() => t.remove(), 3000);
            }
        }

        // ============================================================
        //  INIT
        // ============================================================
        const adminApp = new AdminApp();
    </script>
</body>
</html>
