<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RhinoFX – Admin Dashboard</title>
    <style>
        /* ============================================================
                   GLOBAL RESET & BASE
                   ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #070b12;
            --bg-secondary: #0e1622;
            --bg-card: rgba(18, 28, 46, 0.75);
            --bg-card-hover: rgba(26, 40, 62, 0.85);
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-med: rgba(255, 255, 255, 0.10);
            --text-primary: #f0f4fc;
            --text-secondary: #a8b8d0;
            --text-muted: #6a7e9c;
            --gold: #fbbf24;
            --gold-dark: #d99f1a;
            --gold-glow: rgba(251, 191, 36, 0.25);
            --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.5);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 28px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            padding: 16px;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: #2a3a4e;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3a4e66;
        }

        .container {
            max-width: 1360px;
            margin: 0 auto;
        }

        a {
            text-decoration: none;
            color: inherit;
        }
        .hidden {
            display: none !important;
        }

        /* ============================================================
                   BUTTONS
                   ============================================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 28px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            letter-spacing: 0.01em;
            position: relative;
            overflow: hidden;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #0b0e14;
            box-shadow: 0 4px 20px var(--gold-glow);
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px var(--gold-glow);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.07);
            color: var(--text-primary);
            border: 1px solid var(--border-med);
        }
        .btn-secondary:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--gold);
            color: var(--gold);
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.25);
        }
        .btn-success:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.35);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
            box-shadow: 0 4px 16px rgba(239, 68, 68, 0.2);
        }
        .btn-danger:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(239, 68, 68, 0.3);
        }

        .btn-ghost {
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-ghost:hover:not(:disabled) {
            background: rgba(251, 191, 36, 0.10);
        }

        .btn-sm {
            padding: 6px 16px;
            font-size: 12px;
            border-radius: 30px;
        }
        .btn-xs {
            padding: 3px 12px;
            font-size: 11px;
            border-radius: 20px;
        }

        /* ============================================================
                   HEADER
                   ============================================================ */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            background: rgba(14, 22, 34, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
            position: sticky;
            top: 16px;
            z-index: 60;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: transform 0.2s ease;
            background: linear-gradient(135deg, var(--gold), #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo:hover {
            transform: scale(1.02);
        }
        .logo-icon {
            font-size: 28px;
            -webkit-text-fill-color: initial;
            color: var(--gold);
        }
        .logo span {
            color: var(--text-muted);
            -webkit-text-fill-color: var(--text-muted);
            font-weight: 400;
            background: none;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            padding: 6px 0;
            border-bottom: 2px solid transparent;
            transition: var(--transition);
        }
        .nav-links a:hover {
            color: var(--text-primary);
            border-bottom-color: var(--gold);
        }
        .nav-links a[aria-current="page"] {
            color: var(--gold);
            border-bottom-color: var(--gold);
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 16px 4px 6px;
            border-radius: 40px;
            border: 1px solid var(--border-subtle);
            transition: var(--transition);
        }
        .user-badge:hover {
            border-color: var(--border-med);
        }
        .user-badge .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #0b0e14;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            flex-shrink: 0;
        }
        .user-badge .uname {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }
        .user-badge .role-tag {
            font-size: 10px;
            text-transform: uppercase;
            background: var(--gold);
            padding: 2px 10px;
            border-radius: 20px;
            color: #0b0e14;
            font-weight: 700;
            letter-spacing: 0.4px;
        }
        .user-badge .logout-link {
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
            padding: 4px 8px;
            border-radius: 20px;
            transition: var(--transition);
        }
        .user-badge .logout-link:hover {
            color: #f87171;
            background: rgba(248, 113, 113, 0.10);
        }

        /* ============================================================
                   DASHBOARD LAYOUT
                   ============================================================ */
        .dash-wrapper {
            display: flex;
            gap: 24px;
            padding: 0 0 30px 0;
            min-height: 70vh;
        }

        .dash-sidebar {
            width: 220px;
            flex-shrink: 0;
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 12px 10px;
            height: fit-content;
            position: sticky;
            top: 88px;
            box-shadow: var(--shadow-card);
        }
        .dash-sidebar .menu-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 11px 16px;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            border-left: 3px solid transparent;
            position: relative;
        }
        .dash-sidebar .menu-item:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.04);
        }
        .dash-sidebar .menu-item.active {
            color: var(--gold);
            background: rgba(251, 191, 36, 0.08);
            border-left-color: var(--gold);
        }
        .dash-sidebar .menu-item .icon {
            font-size: 18px;
            width: 24px;
            text-align: center;
            flex-shrink: 0;
        }
        .dash-sidebar .badge-indicator {
            margin-left: auto;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
            padding: 1px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            min-width: 20px;
            text-align: center;
        }

        .dash-content {
            flex: 1;
            min-width: 0;
        }

        /* ============================================================
                   DASHBOARD HEADER
                   ============================================================ */
        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
        }
        .dash-header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #fff, var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .dash-header .sub {
            color: var(--text-muted);
            font-size: 15px;
            font-weight: 400;
        }

        /* ============================================================
                   STATS CARDS
                   ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 20px 24px;
            transition: var(--transition);
            box-shadow: var(--shadow-card);
            position: relative;
            overflow: hidden;
        }
        .stat-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            border-radius: 0 0 50% 50%;
            transition: var(--transition);
        }
        .stat-card:hover {
            transform: translateY(-3px);
            border-color: var(--border-med);
            background: var(--bg-card-hover);
        }
        .stat-card .stat-icon {
            font-size: 24px;
            margin-bottom: 6px;
            opacity: 0.8;
        }
        .stat-card .num {
            font-size: 32px;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }
        .stat-card .label {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
            font-weight: 500;
        }
        .stat-card.gold::after {
            background: linear-gradient(90deg, var(--gold), var(--gold-dark));
        }
        .stat-card.blue::after {
            background: linear-gradient(90deg, #3b82f6, #2563eb);
        }
        .stat-card.green::after {
            background: linear-gradient(90deg, #34d399, #059669);
        }
        .stat-card.purple::after {
            background: linear-gradient(90deg, #a78bfa, #7c3aed);
        }
        .stat-card.red::after {
            background: linear-gradient(90deg, #f87171, #dc2626);
        }

        /* ============================================================
                   TABLES
                   ============================================================ */
        .table-wrap {
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            overflow: hidden;
            overflow-x: auto;
            box-shadow: var(--shadow-card);
        }
        .table-wrap table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 600px;
        }
        .table-wrap th {
            text-align: left;
            padding: 14px 20px;
            background: rgba(0, 0, 0, 0.25);
            color: var(--text-muted);
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            border-bottom: 1px solid var(--border-subtle);
        }
        .table-wrap td {
            padding: 13px 20px;
            border-bottom: 1px solid var(--border-subtle);
            color: var(--text-primary);
        }
        .table-wrap tr:last-child td {
            border-bottom: none;
        }
        .table-wrap tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }
        .table-wrap .actions-cell {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        /* ============================================================
                   BADGES
                   ============================================================ */
        .badge {
            display: inline-block;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        .badge.green {
            background: rgba(6, 95, 70, 0.5);
            color: #34d399;
        }
        .badge.yellow {
            background: rgba(120, 53, 15, 0.5);
            color: #fbbf24;
        }
        .badge.blue {
            background: rgba(30, 58, 95, 0.5);
            color: #60a5fa;
        }
        .badge.red {
            background: rgba(127, 29, 29, 0.5);
            color: #f87171;
        }
        .badge.gold {
            background: rgba(251, 191, 36, 0.15);
            color: var(--gold);
        }

        /* ============================================================
                   FORMS
                   ============================================================ */
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 11px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-med);
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-primary);
            font-size: 14px;
            transition: var(--transition);
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px var(--gold-glow);
        }
        .form-group select option {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .form-message {
            margin-top: 10px;
            font-size: 14px;
            font-weight: 500;
        }

        /* ============================================================
                   LICENSE CARDS
                   ============================================================ */
        .license-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 18px;
            margin-top: 16px;
        }
        .license-card {
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 22px 24px;
            transition: var(--transition);
            box-shadow: var(--shadow-card);
            border-left: 3px solid transparent;
        }
        .license-card:hover {
            border-color: var(--border-med);
            transform: translateY(-3px);
            background: var(--bg-card-hover);
        }
        .license-card .lkey {
            font-family: 'Courier New', monospace;
            font-size: 16px;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 1px;
            word-break: break-all;
        }
        .license-card .linfo {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 4px;
        }
        .license-card .linfo span {
            color: var(--text-secondary);
        }
        .license-card .actions-row {
            margin-top: 14px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* ============================================================
                   PAYMENT CARDS
                   ============================================================ */
        .payment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }
        .payment-card {
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 20px 24px;
            transition: var(--transition);
            box-shadow: var(--shadow-card);
        }
        .payment-card:hover {
            border-color: var(--border-med);
            transform: translateY(-2px);
            background: var(--bg-card-hover);
        }
        .payment-card .pamount {
            font-size: 28px;
            font-weight: 800;
            color: var(--gold);
            letter-spacing: -0.02em;
        }
        .payment-card .pmethod {
            font-size: 13px;
            color: var(--text-muted);
        }
        .payment-card .pdate {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* ============================================================
                   SUPPORT TICKETS
                   ============================================================ */
        .ticket-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 16px;
        }
        .ticket-item {
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            transition: var(--transition);
            cursor: pointer;
            box-shadow: var(--shadow-card);
        }
        .ticket-item:hover {
            border-color: var(--border-med);
            background: var(--bg-card-hover);
            transform: translateX(3px);
        }
        .ticket-item .ticket-info {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .ticket-item .ticket-user {
            font-weight: 600;
            color: var(--text-primary);
        }
        .ticket-item .ticket-subject {
            color: var(--text-muted);
            font-size: 14px;
        }
        .ticket-item .ticket-time {
            color: var(--text-muted);
            font-size: 12px;
        }
        .ticket-item .ticket-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        /* ============================================================
                   CHAT
                   ============================================================ */
        .chat-container {
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            overflow: hidden;
            height: 480px;
            margin-top: 16px;
            box-shadow: var(--shadow-card);
        }
        .chat-messages {
            flex: 1;
            padding: 20px 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }
        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: #2a3a4e;
            border-radius: 4px;
        }

        .chat-message {
            max-width: 78%;
            padding: 12px 18px;
            border-radius: 14px;
            word-break: break-word;
            animation: slideIn 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .chat-message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #0b0e14;
            border-bottom-right-radius: 4px;
        }
        .chat-message.admin {
            align-self: flex-start;
            background: rgba(31, 41, 55, 0.7);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
        }
        .chat-message .meta {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 6px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }
        .chat-message.user .meta {
            color: rgba(11, 14, 20, 0.6);
        }

        .chat-input-area {
            display: flex;
            gap: 12px;
            padding: 14px 20px;
            border-top: 1px solid var(--border-subtle);
            background: rgba(0, 0, 0, 0.2);
            align-items: center;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px 18px;
            border-radius: 40px;
            border: 1px solid var(--border-med);
            background: rgba(0, 0, 0, 0.3);
            color: var(--text-primary);
            font-size: 14px;
            transition: var(--transition);
        }
        .chat-input-area input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px var(--gold-glow);
        }

        /* ============================================================
                   EMPTY STATE
                   ============================================================ */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-muted);
        }
        .empty-state .icon {
            font-size: 52px;
            margin-bottom: 12px;
        }
        .empty-state h3 {
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 20px;
        }
        .empty-state p {
            color: var(--text-muted);
            font-size: 15px;
        }

        /* ============================================================
                   MODAL
                   ============================================================ */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-med);
            border-radius: var(--radius-lg);
            max-width: 580px;
            width: 100%;
            padding: 32px 36px;
            position: relative;
            animation: modalIn 0.3s ease;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
            max-height: 90vh;
            overflow-y: auto;
        }
        @keyframes modalIn {
            from {
                transform: scale(0.96) translateY(20px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }
        .modal-box .close-modal {
            position: sticky;
            top: 0;
            float: right;
            font-size: 28px;
            cursor: pointer;
            color: var(--text-muted);
            transition: var(--transition);
            background: none;
            border: none;
            line-height: 1;
            z-index: 10;
        }
        .modal-box .close-modal:hover {
            color: #f87171;
        }
        .modal-box h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 18px;
            color: var(--gold);
            letter-spacing: -0.02em;
        }

        /* ============================================================
                   TOAST
                   ============================================================ */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--bg-secondary);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-med);
            padding: 16px 24px;
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 14px;
            max-width: 400px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            animation: slideUp 0.4s ease;
            display: flex;
            align-items: center;
            gap: 14px;
            font-weight: 500;
        }
        .toast .toast-icon {
            font-size: 22px;
            flex-shrink: 0;
        }
        .toast.success {
            border-color: #34d399;
        }
        .toast.success .toast-icon {
            color: #34d399;
        }
        .toast.error {
            border-color: #f87171;
        }
        .toast.error .toast-icon {
            color: #f87171;
        }
        .toast.info {
            border-color: #60a5fa;
        }
        .toast.info .toast-icon {
            color: #60a5fa;
        }
        @keyframes slideUp {
            from {
                transform: translateY(40px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* ============================================================
                   SPINNER
                   ============================================================ */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(251, 191, 36, 0.25);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

                   RESPONSIVE
                   ============================================================ */

        class AdminApp {
            constructor() {
                this.currentUser = null;
                this.currentTab = 'overview';
                this.selectedTicketId = null;
                this.init();
            }

            init() {
                this.currentUser = this.getCurrentUser();
                if (!this.currentUser) {
                    window.location.href = 'login.html';
                    return;
                }
                if (this.currentUser.role !== 'admin') {
                    window.location.href = 'user-dashboard.html';
                    return;
                }
                this.updateNav();
                this.renderDashboard();
            }

            getCurrentUser() {
                const session = DB.getSession();
                if (!session) return null;
                return DB.getUsers().find(u => u.id === session.userId) || null;
            }

            updateNav() {
                if (this.currentUser) {
                    document.getElementById('userAvatar').textContent = this.currentUser.name.charAt(0).toUpperCase();
                    document.getElementById('userName').textContent = this.sanitize(this.currentUser.name);
                }
            }

            renderDashboard() {
                this.renderSidebar();
                this.renderContent();
            }

            renderSidebar() {
                const sidebar = document.getElementById('dashSidebar');
                const tickets = DB.getTickets();
                const openTickets = tickets.filter(t => t.status === 'open').length;
                const items = [
                    { id: 'overview', icon: '📊', label: 'Dashboard' },
                    { id: 'users', icon: '👥', label: 'Users' },
                    { id: 'products', icon: '📦', label: 'Products' },
                    { id: 'orders', icon: '📋', label: 'Orders' },
                    { id: 'licenses', icon: '🔑', label: 'Licenses' },
                    { id: 'payments', icon: '💳', label: 'Payments' },
                    { id: 'support', icon: '💬', label: 'Support', badge: openTickets > 0 ? openTickets : null },
                    { id: 'indicators', icon: '📈', label: 'Indicators' },
                    { id: 'eas', icon: '🤖', label: 'Expert Advisors' },
                    { id: 'settings', icon: '⚙️', label: 'Settings' }
                ];
                sidebar.innerHTML = items.map(item =>
                    `<div class="menu-item ${this.currentTab === item.id ? 'active' : ''}" onclick="adminApp.switchTab('${item.id}')">
                        <span class="icon">${item.icon}</span> ${item.label}
                        ${item.badge ? `<span class="badge-indicator">${item.badge}</span>` : ''}
                    </div>`
                ).join('');
            }

            switchTab(tab) {
                this.currentTab = tab;
                this.selectedTicketId = null;
                this.renderDashboard();
            }

            renderContent() {
                const container = document.getElementById('dashContent');
                let html = '';
                try {
                    switch (this.currentTab) {
                        case 'overview':
                            html = this.renderOverview();
                            break;
                        case 'users':
                            html = this.renderUsers();
                            break;
                        case 'products':
                            html = this.renderProducts();
                            break;
                        case 'orders':
                            html = this.renderOrders();
                            break;
                        case 'licenses':
                            html = this.renderLicenses();
                            break;
                        case 'payments':
                            html = this.renderPayments();
                            break;
                        case 'support':
                            html = this.renderSupport();
                            break;
                        case 'indicators':
                            html = this.renderIndicators();
                            break;
                        case 'eas':
                            html = this.renderEAs();
                            break;
                        case 'settings':
                            html = this.renderSettings();
                            break;
                        default:
                            html = '<p>Page not found.</p>';
                    }
                    container.innerHTML = html;
                } catch (e) {
                    container.innerHTML =
                        `<div class="empty-state"><div class="icon">⚠️</div><h3>Error</h3><p>${this.sanitize(e.message)}</p></div>`;
                }
            }

            // ===== OVERVIEW =====
            renderOverview() {
                const users = DB.getUsers();
                const orders = DB.getOrders();
                const products = DB.getProducts();
                const licenses = DB.getLicenses();
                const completed = orders.filter(o => o.status === 'completed');
                const revenue = completed.reduce((s, o) => s + (o.amount || 0), 0);
                const tickets = DB.getTickets();
                const openTickets = tickets.filter(t => t.status === 'open').length;
                const indicators = DB.getIndicators();
                const eas = DB.getEAs();
                return `
                    <div class="dash-header">
                        <div><h1>📊 Dashboard</h1><span class="sub">Welcome, ${this.sanitize(this.currentUser.name)}</span></div>
                        <button class="btn btn-primary btn-sm" onclick="adminApp.renderDashboard()">🔄 Refresh</button>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-card gold"><div class="stat-icon">👥</div><div class="num">${users.length}</div><div class="label">Users</div></div>
                        <div class="stat-card blue"><div class="stat-icon">📋</div><div class="num">${orders.length}</div><div class="label">Orders</div></div>
                        <div class="stat-card green"><div class="stat-icon">💰</div><div class="num">$${revenue.toLocaleString()}</div><div class="label">Revenue</div></div>
                        <div class="stat-card purple"><div class="stat-icon">🔑</div><div class="num">${licenses.length}</div><div class="label">Licenses</div></div>
                        <div class="stat-card red"><div class="stat-icon">🎫</div><div class="num">${openTickets}</div><div class="label">Open Tickets</div></div>
                        <div class="stat-card" style="border-left:3px solid #fbbf24;"><div class="stat-icon">📈</div><div class="num">${indicators.length}</div><div class="label">Indicators</div></div>
                        <div class="stat-card" style="border-left:3px solid #60a5fa;"><div class="stat-icon">🤖</div><div class="num">${eas.length}</div><div class="label">Expert Advisors</div></div>
                    </div>
                    <div class="grid-2col">
                        <div class="panel"><div class="panel-title">🕐 Recent Orders</div>
                            ${orders.length === 0 ? '<p class="text-muted">No orders yet.</p>' :
                            orders.slice(-5).reverse().map(o => {
                                const u = DB.getUsers().find(x => x.id === o.userId);
                                const p = DB.getProducts().find(x => x.id === o.productId);
                                return `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-subtle);font-size:14px;">
                                    <span>${this.sanitize(u ? u.name : 'Unknown')} → ${this.sanitize(p ? p.name : 'Product')}</span>
                                    <span class="badge ${o.status === 'completed' ? 'green' : 'yellow'}">${o.status}</span>
                                </div>`;
                            }).join('')}
                        </div>
                        <div class="panel"><div class="panel-title">⚡ Quick Actions</div>
                            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                                ${['users','products','orders','licenses','indicators','eas','support','settings'].map(t =>
                                    `<button class="btn btn-secondary btn-sm" onclick="adminApp.switchTab('${t}')">${t.charAt(0).toUpperCase()+t.slice(1)}</button>`
                                ).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }

            // ===== USERS =====
            renderUsers() {
                const users = DB.getUsers();
                if (!users.length) return this.emptyState('👥', 'No users');
                return `
                    <div class="dash-header"><h1>👥 Users (${users.length})</h1><button class="btn btn-primary btn-sm" onclick="adminApp.showAddUser()">+ Add</button></div>
                    <div class="table-wrap"><table>
                        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th>Actions</th></tr></thead>
                        <tbody>${users.map(u => `
                            <tr>
                                <td><strong>${this.sanitize(u.name)}</strong></td>
                                <td>${this.sanitize(u.email)}</td>
                                <td><span class="badge ${u.role === 'admin' ? 'gold' : 'blue'}">${u.role}</span></td>
                                <td>${this.formatDate(u.joinDate)}</td>
                                <td>
                                    <button class="btn btn-secondary btn-xs" onclick="adminApp.toggleRole('${u.id}')">${u.role === 'admin' ? '→ User' : '→ Admin'}</button>
                                    ${u.id !== this.currentUser.id ? `<button class="btn btn-danger btn-xs" onclick="adminApp.deleteUser('${u.id}')">✕</button>` : ''}
                                </td>
                            </tr>
                        `).join('')}</tbody>
                    </table></div>
                `;
            }

            showAddUser() {
                this.openModal('Add User', `
                    <form onsubmit="adminApp.handleAddUser(event)">
                        <div class="form-group"><label>Name</label><input type="text" id="addUserName" required /></div>
                        <div class="form-group"><label>Email</label><input type="email" id="addUserEmail" required /></div>
                        <div class="form-group"><label>Password</label><input type="password" id="addUserPass" required minlength="6" /></div>
                        <div class="form-group"><label>Role</label><select id="addUserRole"><option value="user">User</option><option value="admin">Admin</option></select></div>
                        <button type="submit" class="btn btn-primary w-full">Add</button>
                    </form>
                `);
            }

            handleAddUser(e) {
                e.preventDefault();
                const name = document.getElementById('addUserName').value.trim();
                const email = document.getElementById('addUserEmail').value.trim();
                const pass = document.getElementById('addUserPass').value.trim();
                const role = document.getElementById('addUserRole').value;
                const users = DB.getUsers();
                if (users.find(u => u.email === email)) { this.toast('Email exists.', 'error'); return; }
                users.push({ id: 'u_' + Date.now().toString(36), name, email, password: pass, role,
                    joinDate: new Date().toISOString() });
                DB.setUsers(users);
                this.closeModal();
                this.toast('User added.', 'success');
                this.renderDashboard();
            }

            toggleRole(id) {
                const users = DB.getUsers();
                const u = users.find(x => x.id === id);
                if (!u || u.id === this.currentUser.id) { this.toast('Cannot change own role.', 'error'); return; }
                u.role = u.role === 'admin' ? 'user' : 'admin';
                DB.setUsers(users);
                this.toast(`User ${u.name} is now ${u.role}.`, 'success');
                this.renderDashboard();
            }

            deleteUser(id) {
                if (id === this.currentUser.id) { this.toast('Cannot delete yourself.', 'error'); return; }
                if (!confirm('Delete this user?')) return;
                let users = DB.getUsers().filter(u => u.id !== id);
                DB.setUsers(users);
                let orders = DB.getOrders().filter(o => o.userId !== id);
                DB.setOrders(orders);
                let licenses = DB.getLicenses().filter(l => l.userId !== id);
                DB.setLicenses(licenses);
                this.toast('User deleted.', 'success');
                this.renderDashboard();
            }

            // ===== PRODUCTS =====
            renderProducts() {
                const products = DB.getProducts();
                if (!products.length) return this.emptyState('📦', 'No products');
                return `
                    <div class="dash-header"><h1>📦 Products (${products.length})</h1><button class="btn btn-primary btn-sm" onclick="adminApp.showAddProduct()">+ Add</button></div>
                    <div class="table-wrap"><table>
                        <thead><tr><th>Name</th><th>Price</th><th>Type</th><th>Actions</th></tr></thead>
                        <tbody>${products.map(p => `
                            <tr>
                                <td><strong>${this.sanitize(p.name)}</strong></td>
                                <td>$${p.price}</td>
                                <td><span class="badge blue">${p.type || 'standard'}</span></td>
                                <td>
                                    <button class="btn btn-secondary btn-xs" onclick="adminApp.showEditProduct(${p.id})">✎</button>
                                    <button class="btn btn-danger btn-xs" onclick="adminApp.deleteProduct(${p.id})">✕</button>
                                </td>
                            </tr>
                        `).join('')}</tbody>
                    </table></div>
                `;
            }

            showAddProduct() {
                this.openModal('Add Product', `
                    <form onsubmit="adminApp.handleAddProduct(event)">
                        <div class="form-group"><label>Name</label><input type="text" id="addProdName" required /></div>
                        <div class="form-group"><label>Price ($)</label><input type="number" id="addProdPrice" required step="0.01" /></div>
                        <div class="form-group"><label>Type</label><input type="text" id="addProdType" value="standard" /></div>
                        <div class="form-group"><label>Features (comma)</label><input type="text" id="addProdFeatures" /></div>
                        <button type="submit" class="btn btn-primary w-full">Add</button>
                    </form>
                `);
            }

            handleAddProduct(e) {
                e.preventDefault();
                const name = document.getElementById('addProdName').value.trim();
                const price = parseFloat(document.getElementById('addProdPrice').value);
                if (!name || isNaN(price)) { this.toast('Name and price required.', 'error'); return; }
                const products = DB.getProducts();
                const id = products.length ? Math.max(...products.map(p => p.id)) + 1 : 1;
                const features = document.getElementById('addProdFeatures').value.split(',').map(f => f.trim()).filter(Boolean);
                products.push({ id, name, price, type: document.getElementById('addProdType').value.trim() || 'standard',
                    features, description: '', downloadLink: '#' });
                DB.setProducts(products);
                this.closeModal();
                this.toast('Product added.', 'success');
                this.renderDashboard();
            }

            showEditProduct(id) {
                const products = DB.getProducts();
                const p = products.find(x => x.id === id);
                if (!p) return;
                this.openModal('Edit Product', `
                    <form onsubmit="adminApp.handleEditProduct(event, ${id})">
                        <div class="form-group"><label>Name</label><input type="text" id="editProdName" value="${this.sanitize(p.name)}" required /></div>
                        <div class="form-group"><label>Price ($)</label><input type="number" id="editProdPrice" value="${p.price}" step="0.01" /></div>
                        <div class="form-group"><label>Type</label><input type="text" id="editProdType" value="${this.sanitize(p.type)}" /></div>
                        <div class="form-group"><label>Features</label><input type="text" id="editProdFeatures" value="${p.features ? p.features.join(', ') : ''}" /></div>
                        <button type="submit" class="btn btn-primary w-full">Update</button>
                    </form>
                `);
            }

            handleEditProduct(e, id) {
                e.preventDefault();
                const products = DB.getProducts();
                const p = products.find(x => x.id === id);
                if (!p) return;
                p.name = document.getElementById('editProdName').value.trim();
                p.price = parseFloat(document.getElementById('editProdPrice').value);
                p.type = document.getElementById('editProdType').value.trim() || 'standard';
                p.features = document.getElementById('editProdFeatures').value.split(',').map(f => f.trim()).filter(Boolean);
                DB.setProducts(products);
                this.closeModal();
                this.toast('Product updated.', 'success');
                this.renderDashboard();
            }

            deleteProduct(id) {
                if (!confirm('Delete this product?')) return;
                DB.setProducts(DB.getProducts().filter(p => p.id !== id));
                this.toast('Product deleted.', 'success');
                this.renderDashboard();

                const products = DB.getProducts();

                            const p = products.find(x => x.id === o.productId);

                                <td>${this.sanitize(u ? u.name : 'Unknown')}</td>
                                <td>${this.sanitize(p ? p.name : 'Unknown')}</td>

                            </tr>`;
                        }).join('')}</tbody>
                    </table></div>
                `;
            }

            completeOrder(id) {
                const orders = DB.getOrders();
                const o = orders.find(x => x.id === id);
                if (!o) return;
                o.status = 'completed';
                DB.setOrders(orders);
                const key = 'TRX-' + Math.random().toString(36).substring(2, 10).toUpperCase() + '-' + Math.random().toString(36)
                    .substring(2, 10).toUpperCase();
                const licenses = DB.getLicenses();
                if (!licenses.find(l => l.userId === o.userId && l.productId === o.productId)) {
                    licenses.push({ id: 'lic_' + Date.now().toString(36), userId: o.userId, productId: o.productId, key,

            showCreateLicense() {
                const users = DB.getUsers();
                const products = DB.getProducts();
                this.openModal('Create License', `
                    <form onsubmit="adminApp.handleCreateLicense(event)">
                        <div class="form-group"><label>User</label><select id="licUser">${users.map(u => `<option value="${u.id}">${this.sanitize(u.name)}</option>`).join('')}</select></div>
                        <div class="form-group"><label>Product</label><select id="licProduct">${products.map(p => `<option value="${p.id}">${this.sanitize(p.name)}</option>`).join('')}</select></div>
                        <div class="form-group"><label>Max Activations</label><input type="number" id="licMaxAct" value="2" /></div>

                    </form>
                `);
            }

            handleCreateLicense(e) {
                e.preventDefault();
                const userId = document.getElementById('licUser').value;
                const productId = parseInt(document.getElementById('licProduct').value);
                const maxAct = parseInt(document.getElementById('licMaxAct').value) || 2;
                const days = parseInt(document.getElementById('licExpiryDays').value) || 365;
                const key = 'TRX-' + Math.random().toString(36).substring(2, 10).toUpperCase() + '-' + Math.random().toString(36)
                    .substring(2, 10).toUpperCase();
                const licenses = DB.getLicenses();
                licenses.push({ id: 'lic_' + Date.now().toString(36), userId, productId, key, status: 'active',
                    expiryDate: new Date(Date.now() + days * 86400000).toISOString(), maxActivations: maxAct,
                    usedActivations: 0, createdAt: new Date().toISOString() });
                DB.setLicenses(licenses);
                this.closeModal();
                this.toast('License created.', 'success');
                this.renderDashboard();
            }

            revokeLicense(id) {
                if (!confirm('Revoke this license?')) return;
                const licenses = DB.getLicenses();
                const l = licenses.find(x => x.id === id);
                if (l) { l.status = 'revoked';
                    DB.setLicenses(licenses);
                    this.toast('License revoked.', 'success');
                    this.renderDashboard(); }
            }

            copyKey(key) {
                navigator.clipboard?.writeText(key).then(() => this.toast('Copied!', 'success')).catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = key;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    ta.remove();
                    this.toast('Copied!', 'success');
                });
            }

            // ===== SUPPORT =====
            renderSupport() {
                const tickets = DB.getTickets();

                if (!tickets.length) return this.emptyState('💬', 'No tickets');
                const users = DB.getUsers();
                return `
                    <div class="dash-header"><h1>💬 Support (${tickets.filter(t => t.status === 'open').length} open)</h1></div>
                    <div class="ticket-grid">${tickets.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)).map(t => {
                        const u = users.find(x => x.id === t.userId);
                        return `<div class="ticket-item" onclick="adminApp.openTicket('${t.id}')">
                            <div class="ticket-info">
                                <span style="font-size:20px;">${t.priority === 'high' ? '🔴' : '🟡'}</span>
                                <div><div class="ticket-user">${u ? this.sanitize(u.name) : 'Unknown'}</div><div class="ticket-subject">${this.sanitize(t.subject)}</div></div>

                                <span class="badge ${t.status === 'open' ? 'yellow' : 'green'}">${t.status}</span>
                                <span class="ticket-time">${this.formatDate(t.createdAt)}</span>

                            </div>
                        </div>`;
                    }).join('')}</div>
                `;
            }

            renderTicketChat() {
                const tickets = DB.getTickets();
                const ticket = tickets.find(t => t.id === this.selectedTicketId);
                if (!ticket) { this.selectedTicketId = null; return this.renderSupport(); }
                const user = DB.getUsers().find(u => u.id === ticket.userId);
                const messages = DB.getMessagesForConversation(ticket.userId) || [];
                DB.markConversationRead(ticket.userId);
                return `
                    <div class="dash-header">
                        <div><h1>💬 ${this.sanitize(ticket.subject)}</h1><span class="sub">${user ? this.sanitize(user.name) : 'Unknown'}</span></div>
                        <div><button class="btn btn-secondary btn-sm" onclick="adminApp.closeTicket()">← Back</button>
                        ${ticket.status === 'open' ? `<button class="btn btn-success btn-sm" onclick="adminApp.resolveTicket('${ticket.id}')">✓ Resolve</button>` : ''}</div>
                    </div>
                    <div class="chat-container">
                        <div class="chat-messages" id="chatMessages">
                            ${messages.length === 0 ? '<p style="color:var(--text-muted);padding:20px;">No messages.</p>' :
                            messages.map(m => `<div class="chat-message ${m.sender}">
                                <div>${this.sanitize(m.text) || ''}</div>
                                <div class="meta"><span>${m.sender === 'user' ? (user ? user.name : 'User') : 'Admin'}</span><span>${this.formatDate(m.timestamp)}</span></div>
                            </div>`).join('')}
                        </div>
                        <div class="chat-input-area">
                            <input type="text" id="chatInput" placeholder="Reply..." />
                            <button class="btn btn-primary btn-sm" onclick="adminApp.sendReply('${ticket.id}')">Send</button>
                        </div>
                    </div>
                `;
            }

            openTicket(id) {
                this.selectedTicketId = id;
                this.renderDashboard();
                setTimeout(() => {
                    const el = document.getElementById('chatMessages');
                    if (el) el.scrollTop = el.scrollHeight;
                }, 100);
            }

            closeTicket() { this.selectedTicketId = null;
                this.renderDashboard(); }

            resolveTicket(id) {
                const tickets = DB.getTickets();
                const t = tickets.find(x => x.id === id);
                if (t) { t.status = 'resolved';
                    DB.setTickets(tickets);
                    this.toast('Ticket resolved.', 'success');
                    this.selectedTicketId = null;
                    this.renderDashboard(); }
            }

            sendReply(ticketId) {
                const input = document.getElementById('chatInput');
                const text = (input?.value || '').trim();
                if (!text) { this.toast('Message required.', 'info'); return; }
                const ticket = DB.getTickets().find(t => t.id === ticketId);
                if (!ticket) return;
                DB.addMessage(ticket.userId, 'admin', text);
                ticket.updatedAt = new Date().toISOString();
                DB.setTickets(DB.getTickets());
                input.value = '';
                this.renderDashboard();
                setTimeout(() => {
                    const el = document.getElementById('chatMessages');
                    if (el) el.scrollTop = el.scrollHeight;
                }, 100);
                this.toast('Reply sent.', 'success');
            }
