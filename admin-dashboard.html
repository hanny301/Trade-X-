            //  7. SUPPORT (TICKETS + CHAT)
            // ============================================================
            renderSupport() {
                const tickets = DB.getTickets();
                const users = DB.getUsers();

                // If a ticket is selected, show chat view
                if (this.selectedTicketId) {
                    return this.renderTicketChat();
                }

                // Otherwise show ticket list
                if (tickets.length === 0) {
                    return this.renderEmptyState('💬', 'No support tickets', 'Tickets will appear when users contact support.');
                }

                return `
                    <div class="dash-header">
                        <h1>💬 Support Tickets</h1>
                        <span style="color:#9ca3af;font-size:14px;">${tickets.filter(t => t.status === 'open').length} open</span>
                    </div>
                    <div class="ticket-grid">${tickets.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)).map(t => {
                        const user = users.find(u => u.id === t.userId);
                        const statusClass = t.status === 'open' ? 'yellow' : t.status === 'resolved' ? 'green' : 'blue';
                        const priorityIcon = t.priority === 'high' ? '🔴' : t.priority === 'medium' ? '🟡' : '🟢';
                        return `
                            <div class="ticket-item" onclick="adminApp.openTicket('${t.id}')">
                                <div class="ticket-info">
                                    <span style="font-size:20px;">${priorityIcon}</span>
                                    <div>
                                        <div class="ticket-user">${user ? this.sanitize(user.name) : 'Unknown'}</div>
                                        <div class="ticket-subject">${this.sanitize(t.subject)}</div>
                                    </div>
                                </div>
                                <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
                                    <span class="badge ${statusClass}">${t.status}</span>
                                    <span class="ticket-time">${this.formatDate(t.createdAt)}</span>
                                    <button class="btn-primary small" onclick="event.stopPropagation(); adminApp.openTicket('${t.id}')">View</button>
                                    ${t.status === 'open' ? `<button class="btn-success small" onclick="event.stopPropagation(); adminApp.resolveTicket('${t.id}')">Resolve</button>` : ''}
                                </div>
                            </div>
                        `;
                    }).join('')}</div>
                `;
            }

            renderTicketChat() {
                const tickets = DB.getTickets();
                const ticket = tickets.find(t => t.id === this.selectedTicketId);
                if (!ticket) {
                    this.selectedTicketId = null;
                    return this.renderSupport();
                }

                const users = DB.getUsers();
                const user = users.find(u => u.id === ticket.userId);
                const messages = DB.getMessagesForConversation(ticket.userId) || [];

                // Mark messages as read
                DB.markConversationRead(ticket.userId);

                return `
                    <div class="dash-header">
                        <div>
                            <h1>💬 Ticket: ${this.sanitize(ticket.subject)}</h1>
                            <span class="sub">${user ? this.sanitize(user.name) : 'Unknown'} • ${this.formatDate(ticket.createdAt)}</span>
                        </div>
                        <div style="display:flex;gap:8px;flex-wrap:wrap;">
                            <button class="btn-outline" onclick="adminApp.closeTicket()">← Back</button>
                            ${ticket.status === 'open' ? `<button class="btn-success" onclick="adminApp.resolveTicket('${ticket.id}')">✓ Resolve</button>` : ''}
                            <button class="btn-danger" onclick="adminApp.deleteTicket('${ticket.id}')">✕ Delete</button>
                        </div>
                    </div>

                    <div style="display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap;">
                        <span class="badge ${ticket.status === 'open' ? 'yellow' : 'green'}">${ticket.status}</span>
                        <span class="badge ${ticket.priority === 'high' ? 'red' : ticket.priority === 'medium' ? 'yellow' : 'blue'}">${ticket.priority}</span>
                    </div>

                    <div class="chat-container">
                        <div class="chat-messages" id="adminChatMessages" role="log">
                            ${messages.length === 0 ? '<p style="color:#6b7280;text-align:center;padding:20px;">No messages in this conversation.</p>' :
                                messages.map(m => `
                                    <div class="chat-message ${m.sender}" role="article">
                                        <div>${this.sanitize(m.text) || '<em>📎 File attachment</em>'}</div>
                                        ${m.attachments && m.attachments.length > 0 ? this.renderAttachments(m.attachments) : ''}
                                        <div class="meta">
                                            <span>${m.sender === 'user' ? (user ? this.sanitize(user.name) : 'User') : 'You (Admin)'}</span>
                                            <span>${this.formatDate(m.timestamp)}</span>
                                        </div>
                                    </div>
                                `).join('')
                            }
                        </div>
                        <div class="file-preview empty" id="adminFilePreview"></div>
                        <div class="chat-input-area">
                            <div class="file-input-wrapper">
                                <button class="btn-outline" onclick="adminApp.triggerFileInput()" title="Attach files" style="padding:8px 12px;cursor:pointer;">📎</button>
                                <input type="file" id="adminChatFileInput" multiple accept="image/*,video/*,.pdf,.doc,.docx,.zip,.txt" />
                            </div>
                            <input type="text" id="adminChatInput" placeholder="Reply to ${user ? this.sanitize(user.name) : 'user'}..." />
                            <button class="btn-primary" id="sendAdminBtn" onclick="adminApp.sendSupportReply()">Send</button>
                        </div>
                    </div>
                `;
            }

            openTicket(id) {
                this.selectedTicketId = id;
                this.pendingAttachments = [];
                this.renderDashboard();
                setTimeout(() => {
                    const container = document.getElementById('adminChatMessages');
                    if (container) container.scrollTop = container.scrollHeight;
                }, 100);
            }

            closeTicket() {
                this.selectedTicketId = null;
                this.pendingAttachments = [];
                this.renderDashboard();
            }

            resolveTicket(id) {
                const tickets = DB.getTickets();
                const t = tickets.find(x => x.id === id);
                if (t) {
                    t.status = 'resolved';
                    t.updatedAt = new Date().toISOString();
                    DB.setTickets(tickets);
                    this.showToast('Ticket resolved.', 'success');
                    if (this.selectedTicketId === id) {
                        this.selectedTicketId = null;
                    }
                    this.renderDashboard();
                }
            }

            deleteTicket(id) {
                if (!confirm('Delete this ticket?')) return;
                let tickets = DB.getTickets();
                tickets = tickets.filter(t => t.id !== id);
                DB.setTickets(tickets);
                if (this.selectedTicketId === id) this.selectedTicketId = null;
                this.showToast('Ticket deleted.', 'success');
                this.renderDashboard();
            }

            triggerFileInput() {
                document.getElementById('adminChatFileInput').click();
            }

            handleFileChange(e) {
                if (e.target.id === 'adminChatFileInput') {
                    this.handleFileSelection(e);
                }
            }

            handleFileSelection(e) {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                const maxTotalSize = 5 * 1024 * 1024;
                const maxFileSize = 2 * 1024 * 1024;
                const maxFiles = 5;

                if (this.pendingAttachments.length + files.length > maxFiles) {
                    this.showToast(`Maximum ${maxFiles} files per message.`, 'error');
                    e.target.value = '';
                    return;
                }

                let totalSize = this.pendingAttachments.reduce((sum, f) => sum + f.size, 0);

                for (const file of files) {
                    if (file.size > maxFileSize) {
                        this.showToast(`File "${this.sanitize(file.name)}" exceeds 2MB limit.`, 'error');
                        e.target.value = '';
                        return;
                    }
                    totalSize += file.size;
                    if (totalSize > maxTotalSize) {
                        this.showToast('Total attachment size exceeds 5MB limit.', 'error');
                        e.target.value = '';
                        return;
                    }
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        this.pendingAttachments.push({
                            name: file.name,
                            type: file.type,
                            data: ev.target.result,
                            size: file.size
                        });
                        this.renderFilePreview();
                    };
                    reader.onerror = () => {
                        this.showToast(`Failed to read file "${this.sanitize(file.name)}"`, 'error');
                    };
                    reader.readAsDataURL(file);
                }
                e.target.value = '';
            }

            renderFilePreview() {
                const preview = document.getElementById('adminFilePreview');
                if (!preview) return;
                if (this.pendingAttachments.length === 0) {
                    preview.classList.add('empty');
                    preview.innerHTML = '';
                    return;
                }
                preview.classList.remove('empty');
                preview.innerHTML = this.pendingAttachments.map((f, i) => `
                    <div class="file-tag">
                        📎 ${this.sanitize(f.name)} (${(f.size / 1024).toFixed(0)}KB)
                        <span class="remove" onclick="adminApp.removeAttachment(${i})" role="button" tabindex="0">✕</span>
                    </div>
                `).join('');
            }

            removeAttachment(index) {
                this.pendingAttachments.splice(index, 1);
                this.renderFilePreview();
            }

            sendSupportReply() {
                if (!this.selectedTicketId) return;
                const ticket = DB.getTickets().find(t => t.id === this.selectedTicketId);
                if (!ticket) return;

                const input = document.getElementById('adminChatInput');
                const text = (input?.value || '').trim();

                if (!text && this.pendingAttachments.length === 0) {
                    this.showToast('Message cannot be empty.', 'info');
                    return;
                }

                const sendBtn = document.getElementById('sendAdminBtn');
                this.setButtonLoading(sendBtn, true);

                try {
                    const attachments = this.pendingAttachments.map(f => ({
                        name: f.name,
                        type: f.type,
                        data: f.data,
                        size: f.size
                    }));

                    DB.addMessage(ticket.userId, 'admin', text, attachments);
                    this.pendingAttachments = [];
                    this.renderFilePreview();
                    if (input) input.value = '';

                    // Update ticket timestamp
                    ticket.updatedAt = new Date().toISOString();
                    DB.setTickets(DB.getTickets());

                    this.renderSupport();
                    this.showToast('Reply sent.', 'success');

                    setTimeout(() => {
                        const container = document.getElementById('adminChatMessages');
                        if (container) container.scrollTop = container.scrollHeight;
                    }, 100);
                } catch (error) {
                    console.error('Error sending message:', error);
                    this.showToast('Failed to send message.', 'error');
                } finally {
                    this.setButtonLoading(sendBtn, false);
                }
            }

            renderAttachments(attachments) {
                return `<div class="attachments">${attachments.map(att => {
                    if (att.type?.startsWith('image/')) {
                        return `<a href="javascript:void(0)" onclick="adminApp.openImageModal('${att.data.replace(/'/g, "\\'")}')"><img src="${att.data}" alt="${this.sanitize(att.name)}" loading="lazy" /></a>`;
                    } else if (att.type?.startsWith('video/')) {
                        return `<video controls style="max-width:150px;max-height:120px;border-radius:6px;border:1px solid #374151;"><source src="${att.data}" type="${att.type}"></video>`;
                    } else {
                        return `<a href="${att.data}" download="${this.sanitize(att.name)}">📎 ${this.sanitize(att.name)}</a>`;
                    }
                }).join('')}</div>`;
            }

            // ============================================================
            //  MODAL HELPERS
            // ============================================================
            openModal(title, bodyHTML) {
                document.getElementById('modalTitle').textContent = title;
                document.getElementById('modalBody').innerHTML = bodyHTML;
                document.getElementById('genericModal').classList.add('open');
            }

            closeModal() {
                document.getElementById('genericModal').classList.remove('open');
            }

            // ============================================================
            //  UTILITIES
            // ============================================================
            formatDate(timestamp) {
                if (!timestamp) return 'N/A';
                const dt = new Date(timestamp);
                if (isNaN(dt.getTime())) return 'Invalid date';
                return dt.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: true
                });
            }

            sanitize(text) {
                if (!text) return '';
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            renderEmptyState(icon, title, message) {
                return `
                    <div class="empty-state">
                        <div class="icon">${icon}</div>
                        <h3>${title}</h3>
                        <p class="text-muted">${message}</p>
                    </div>
                `;
            }

            openImageModal(dataUrl) {
                const modal = document.getElementById('imageModal');
                const img = document.getElementById('modalImage');
                img.src = dataUrl;
                modal.classList.add('open');
            }

            closeImageModal() {
                document.getElementById('imageModal').classList.remove('open');
                document.getElementById('modalImage').src = '';
            }

            showToast(message, type = 'info') {
                const existing = document.querySelector('.toast');
                if (existing) existing.remove();

                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                const icons = { success: '✅', error: '❌', info: 'ℹ️' };
                toast.innerHTML = `
                    <span class="toast-icon" aria-hidden="true">${icons[type] || 'ℹ️'}</span>
                    <span>${this.sanitize(message)}</span>
                `;
                toast.setAttribute('role', 'status');
                toast.setAttribute('aria-live', 'polite');
                document.body.appendChild(toast);

                setTimeout(() => toast.remove(), 4000);
            }

            setButtonLoading(btn, isLoading) {
                if (!btn) return;
                this.isLoading = isLoading;
                btn.disabled = isLoading;
                if (isLoading) {
                    btn.innerHTML = '<span class="spinner"></span>';
                } else {
                    btn.textContent = 'Send';
                }
            }

            handleKeyPress(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    const chatInput = document.getElementById('adminChatInput');
                    if (document.activeElement === chatInput) {
                        e.preventDefault();
                        this.sendSupportReply();
                    }
                }
                if (e.key === 'Escape') {
                    this.closeModal();
                    this.closeImageModal();
                }
            }

            handleVisibilityChange() {
                if (!document.hidden) {
                    this.renderDashboard();
                }
            }
        }

        // ============================================================
        //  HELPERS
        // ============================================================
        function getCurrentUser() {
            if (typeof DB === 'undefined') return null;
            const session = DB.getSession();
            if (!session) return null;
            return DB.getUsers().find(u => u.id === session.userId) || null;
        }

        function uid() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        }

        // ============================================================
        //  INIT
        // ============================================================
        let adminApp;
        document.addEventListener('DOMContentLoaded', () => {
            try {
                adminApp = new AdminDashboardApp();
            } catch (error) {
                console.error('Failed to initialize AdminDashboardApp:', error);
                document.getElementById('dashContent').innerHTML = `
                    <div class="empty-state">
                        <div class="icon">⚠️</div>
                        <h3>Application Error</h3>
                        <p class="text-muted">Failed to load admin dashboard. Please refresh and try again.</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
